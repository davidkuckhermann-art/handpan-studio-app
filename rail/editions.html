<!doctype html>
<html lang="en">

<meta charset="utf-8">

<title>Editions demo</title>
<style>
:root{--bg:#EEF0EF;--card:#fff;--ink:#1F2528;--ink2:#5F6A6E;--ink3:#98A2A5;--line:#D9DEDD;--track:#E2E6E5;--amber:#B07A18;--amber-soft:#F6ECD7;--paper:#FBF8F2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit}
.bar{height:52px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--card)}
.ttl{font-size:15px;color:var(--ink)}
.title span{color:var(--ink2);font-size:12.5px;margin-left:6px}
.fld[hidden]{display:none}
.fld{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);font-weight:500}
.seg{display:inline-flex;background:var(--track);padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(31,37,40,.16)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:13px}
.right{margin-left:auto}
iframe{display:block;width:100%;height:calc(100% - 52px);border:0;background:#fff}
.panel{position:fixed;top:58px;right:16px;width:min(420px,calc(100% - 32px));max-height:calc(100% - 80px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(31,37,40,.18);padding:14px 16px;z-index:20}
.panel[hidden]{display:none}
/* THE COMPARISON (David, 8 Oct 2026: "a comparison button that gives you a comparison view of the different tiers"):
   every row of the Switchboard by its groups, a column per edition and the add-on; the edition in view is tinted */
.cmp{position:fixed;top:52px;left:0;right:0;bottom:0;background:var(--bg);overflow:auto;z-index:40;padding:18px 16px 40px}
.cmp[hidden]{display:none}
.cmp .in{max-width:980px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cmp .hd{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmp .hd h2{font-size:17px;margin:0}.cmp .hd p{margin:0;color:var(--ink2);font-size:12.5px}
.cmp .wrap{overflow-x:auto}
.cmp table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
.cmp th,.cmp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.cmp thead th{position:sticky;top:0;background:var(--card);z-index:2;font-size:13px}
.cmp thead th small{display:block;font-weight:400;color:var(--ink2);font-size:11.5px}
.cmp td:first-child,.cmp th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:200px}
.cmp tr.grp td{background:#E3E9E8;border-top:2px solid #AEBAB8;font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:12px 10px 7px}
.cmp .cur{background:#F4F8F7}.cmp thead th.cur{background:#E8F1EF}
.cmp .yes{color:#2E6B6A;font-weight:700;font-size:15px}.cmp .no{color:var(--ink3)}
.cmp .lim{display:inline-block;color:#7A5410;background:var(--amber-soft);border:1px solid #E3C68C;border-radius:6px;padding:1px 6px;font-size:11.5px;line-height:1.3;max-width:180px}
.cmp .add{color:#6B4B9A;font-weight:700}
.cmp .fd{display:block;color:var(--ink2);font-size:11.5px;font-weight:400}
.panel h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:6px 0 6px}
.panel ul{margin:0 0 10px;padding-left:18px}
.panel li{margin:2px 0}
.panel .n{color:var(--amber);font-weight:600}
.panel p{margin:0 0 8px;color:var(--ink2);font-size:12.5px}
/* the upgrade sheet: a draft, new design */
.sheetwrap{position:fixed;inset:0;background:rgba(31,37,40,.38);display:grid;place-items:center;z-index:30}
.sheetwrap[hidden]{display:none}
.sheet{background:var(--paper);border-radius:18px;width:min(440px,calc(100% - 32px));padding:24px 26px 20px;box-shadow:0 20px 50px rgba(31,37,40,.3)}
.sheet .lockc{width:40px;height:40px;border-radius:50%;background:#F1EDE6;color:#5E5749;display:grid;place-items:center;margin-bottom:12px;box-shadow:0 0 0 1px rgba(94,87,73,.14)}
.sheet .lockc svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet .lockc svg .kh{fill:currentColor;stroke:none}
.sheet h2{font-size:20px;margin:0 0 4px}
.sheet .tier{color:var(--amber);font-weight:600;margin:0 0 14px}
.sheet h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.sheet ul{margin:0 0 18px;padding-left:18px}
.sheet .lifts{margin:0 0 18px;font-size:13px;color:var(--ink2)}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end}
.sheet .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.sheet .demo{font-size:11.5px;color:var(--ink3);margin:12px 0 0}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-weight:500;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.gone{height:100%;display:grid;place-content:center;gap:6px;text-align:center;color:var(--ink2)}
.gone b{font-size:17px;color:var(--ink)}
</style>
</head>
<body>
<div class="bar">
  <div class="fld" title="A demo on the real app (dev), from the Switchboard's saved file"><b class="ttl">Edition</b><div class="seg" id="eds"></div></div>
  <div class="fld">What it leaves out<div class="seg" id="mode"><button data-mode="lock" aria-pressed="false">Locked</button><button data-mode="hide" aria-pressed="false">Hidden</button><button data-mode="fold" aria-pressed="true">Folded</button></div></div>
  <div class="fld" title="The limited features' notes - the labels and orange dots">Limit notes<div class="seg" id="notes"><button data-notes="show" aria-pressed="true">Shown</button><button data-notes="hide" aria-pressed="false">Hidden</button></div></div>
  <div class="fld" title="The app's style: Simple shows the essentials with ready-made choices, Full every tool and setting">App style<div class="seg" id="style"><button data-style="simple" aria-pressed="false">Simple</button><button data-style="full" aria-pressed="true">Full</button></div></div>
  <button class="btn right" id="cmpBtn" title="Every feature, edition by edition">Compare</button>
  <button class="btn" id="limBtn">Limits ▾</button>
</div>
<div class="panel" id="limPanel" hidden></div>
<div class="cmp" id="cmpPanel" hidden></div>
<iframe id="app" title="Handpan Studio"></iframe>
<div class="sheetwrap" id="sheet" hidden></div>
<div class="toast" id="toast"></div>

<script>
const APP_LOCAL='app.html?rail=1';   // where the app is, at home (the builder hands its own)
/* Where each feature's doors are on the desktop (the rail layout), by element id. The older switches follow the
   test version's SW_UI; the rest were read from the running dev app on 1 Oct. A limited feature's note goes on the
   doors that exist; a feature with no door here is listed in the panel. */
const MAP={
  library:['railLib'], coursepieces:[], courselink:['linkBtn'], mthpieces:[],
  transpose:[], custompans:['pmCustom','pmSaveMine','ppMine'],   /* the Instruments entry is the pan library's, which the app switches (David, 7 Oct: "we need the scale selector in free tier") */
  chordchart:['railChords'], bass:[], drums:[], guitar:[], piano:[],   /* the band: the app switches it itself (patches/editions-band.py) */
  print:['expPrRow'], export:['expAudioRow'], files:['libIO','cpCode','cpLink'],
  listening:['setListenRow','lcListen','lcListenQuiz','railTuner'], mixer:[],
  tab:['viewTab'], flow:['viewFlow','fszDn','fszUp'], staff:['staffBtn'], pantab:['panBtn'], chordtab:['chordBtn'],
  chordnames:[], loops:[], tablelisten:['tpBtn'], allskins:[], fourpans:['fourBtn'],
  jam:['railJam'], jamauto:['genBtn'], jamown:[], jambreaks:['brkBtn'], jamchords:['jamSetBtn'], jamrecord:[],
  editor:['railArr','editBtn','footEdit'], grooveeditor:['railGrv'], bassline:[], tablegroove:[], articulations:[],
  drumgrooves:['railDg'], learn:['railLearn'], plog:['railLog'], quiz:[], quizlisten:[], cp:[], cplisten:[],
  scales:[], scaleslisten:[], tuner:['railTuner']
};
// a padlock drawn like the app's icons (24-unit grid, round line ends); its ink spans 3.5-20.5 both ways, so it is centred
const LOCK='<svg viewBox="0 0 24 24" aria-hidden="true" class="fdemo-svg"><rect x="5" y="10.5" width="14" height="10" rx="2.6"/><path d="M8.2 10.5V7.6a3.8 3.8 0 0 1 7.6 0v2.9"/><circle cx="12" cy="15.5" r="1.15" class="kh"/></svg>';
const frame=document.getElementById('app');
/* THE APP RUNS AS THE EDITION (patches/editions-band.py): it is handed the Switchboard's columns and opened with
   ?edition=, and switches off what that edition does not have, wherever it is - as the real editions will. This page
   lays Locked / Hidden / Folded on what the app switched off; its own MAP still governs the rooms in the rail. */
let appKey='', appBase='app.html?rail=1';
let appStyle='full'; try{appStyle=localStorage.getItem('fdemo.style')==='simple'?'simple':'full'}catch(e){}   // Simple | Full, handed to the app as ?simple=1|0 - a look that never writes the app's own setting (David, 8 Oct)
function loadApp(k,base){ if(k!=null) appKey=k; if(base) appBase=base; window.HPS_EDITIONS=D;
  frame.src=appBase+(appBase.includes('?')?'&':'?')+'edition='+encodeURIComponent(ed)+(appKey?'&k='+encodeURIComponent(appKey):'')+'&simple='+(appStyle==='simple'?'1':'0'); }
let D=null, mode='fold', ed='free',   // Folded is the default (David, 3 Oct)
    obs=null, timer=0, first=true;
const openGroups=new Set();   // the rail groups whose More is open
try{mode=localStorage.getItem('fdemo.mode')||'fold';ed=localStorage.getItem('fdemo.ed')||'free'}catch(e){}
let notes='show'; try{notes=localStorage.getItem('fdemo.notes')==='hide'?'hide':'show'}catch(e){}   // the limit notes shown or hidden (David, 7 Oct)
const ORDER=['free','premium1','premium2'];          // the three editions, lowest first

/* ---- the Free column, read the Switchboard's way: needs must show too; a feature the file does not list is on */
const feat=id=>D.features.find(f=>f.id===id);
const raw=(c,id)=>(D.values[c]||{})[id];
function level(id){
  const f=feat(id); if(!f) return 'on';                 // not listed separately, or not a switch: on for everyone
  const v=raw(ed,id); if(!v) return 'off';
  if((f.needs||[]).some(p=>feat(p)&&level(p)==='off')) return 'off';
  return v==='limited'?'limited':'on';
}
const limitOf=id=>(((D.limits||{})[ed]||{})[id])||'limited';
const tierFor=id=>{for(const t of ORDER.slice(ORDER.indexOf(ed)+1))if(raw(t,id))return t;return null};   // the next tier up that has it
const tierName=t=>(D.editions.find(e=>e.id===t)||{name:t}).name;

/* ---- laying Free over the app */
function ensureStyle(doc){
  if(doc.getElementById('fdemo-style')) return;
  const s=doc.createElement('style'); s.id='fdemo-style';
  s.textContent=`
    [data-fdemo="off"]{display:none!important}
    [data-fdemo="fold"]{display:none!important}
    [data-fdemo="fold"].fdemo-shown{display:flex!important;color:#A3ABAD!important}
    [data-fdemo="fold"].fdemo-shown svg:not(.fdemo-svg){opacity:.4}
    .fdemo-fold{position:relative}
    #rail.fdemo-foldmode>*{flex-shrink:0}   /* an overfull rail scrolls; its items never squeeze (that moved Play and Jam up into the logo) */
    .fdemo-fold .fdemo-chev{transition:transform .8s cubic-bezier(.16,1,.3,1)}
    .fdemo-fold.open .fdemo-chev{transform:rotate(180deg)}
    .fdemo-fold .fdemo-chev{will-change:transform}
    [data-fdemo="lock"]{color:#A3ABAD!important;cursor:pointer!important}
    [data-fdemo="lock"] svg:not(.fdemo-svg),[data-fdemo="lock"] img{opacity:.4}
    .fdemo-badge{position:absolute;z-index:50;pointer-events:none}
    .fdemo-badge[data-kind="lock"]{top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:#FBF8F2;color:#7D7466;
      display:grid;place-items:center;box-shadow:0 0 0 1px rgba(94,87,73,.16),0 1px 2px rgba(60,50,30,.12)}
    /* the rail draws its icons as 20px outlines (#rail .re svg outranks a class): the lock must win outright */
    .fdemo-badge[data-kind="lock"] svg.fdemo-svg{width:12px!important;height:12px!important;fill:none!important;stroke:currentColor!important;
      stroke-width:2.1!important;stroke-linecap:round!important;stroke-linejoin:round!important;display:block!important;opacity:1!important}
    .fdemo-badge[data-kind="lock"] svg.fdemo-svg .kh{fill:currentColor!important;stroke:none!important}
    .fdemo-badge.in[data-kind="lock"]{top:3px;right:auto;left:calc(50% + 5px)}   /* in the rail: against the icon's top right */
    .fdemo-badge.flow[data-kind="note"]{position:static;display:block;margin:3px 4px 0;white-space:normal!important;max-width:none!important;text-align:center;font-size:9px!important}
    .fdemo-badge.dot[data-kind="note"]{width:10px;height:10px;padding:0!important;border-radius:50%;background:#E0A030!important;border:2px solid #fff!important;right:-3px!important;bottom:-3px!important;font-size:0!important}
    .fdemo-badge[data-kind="note"]{right:2px;bottom:-8px;font:600 9.5px/1.25 -apple-system,BlinkMacSystemFont,sans-serif;color:#7A5410;background:#F6ECD7;border:1px solid #E3C68C;border-radius:6px;padding:1px 5px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;letter-spacing:0;text-transform:none}`;
  doc.head.appendChild(s);
}
function badge(el,kind,text){
  const doc=el.ownerDocument;
  // a note marks one control, never a group of them: anchoring it would make the group the frame of what it lays out
  // (the band's instruments spilled past the transport's end in Free, David 7 Oct) - the room's own entry carries it
  if(kind==='note'&&(notes==='hide'||(el.tagName!=='BUTTON'&&el.querySelector('button')))) return;   // hidden by the Limit notes control
  if(doc.defaultView.getComputedStyle(el).position==='static') el.style.position='relative';
  let b=[...el.children].find(c=>c.classList.contains('fdemo-badge')&&c.dataset.kind===kind);
  if(b&&kind==='note'){ if(!b.textContent.includes(text)){b.textContent+=' · '+text; b.title=b.textContent} return }   // one row's note once
  b=doc.createElement('span'); b.className='fdemo-badge'; b.dataset.kind=kind;
  // where it sits: inside a rail item (the rail clips what sticks out), a dot on a small button, else a pill below
  const inRail=/^rail/.test(el.id), small=el.getBoundingClientRect().width<60;
  if(kind==='lock'&&inRail) b.classList.add('in');
  if(kind==='note') b.classList.add(inRail?'flow':small?'dot':'pill');
  if(kind==='lock'){b.innerHTML=LOCK}else{b.textContent=tierName(ed)+': '+text; b.title=b.textContent}
  el.appendChild(b);
}
function apply(){
  const doc=frame.contentDocument; if(!D||!doc||!doc.body) return;
  if(obs) obs.disconnect();
  ensureStyle(doc);
  doc.querySelectorAll('[data-fdemo]').forEach(el=>{el.removeAttribute('data-fdemo');el.removeAttribute('data-fdemo-f')});
  doc.querySelectorAll('.fdemo-badge').forEach(b=>b.remove());
  for(const [id,targets] of Object.entries(MAP)){
    const L=level(id); if(L==='on') continue;
    for(const t of targets){
      const el=doc.getElementById(t); if(!el) continue;
      if(L==='off'){
        // only what the app itself would show is folded away (it keeps the Practice log's entry and, with Listening off, the Tuner hidden)
        const folds=mode==='fold'&&el.parentElement&&el.parentElement.id==='rail'&&doc.defaultView.getComputedStyle(el).display!=='none';
        const m=folds?'fold':mode==='hide'?'off':'lock';
        el.setAttribute('data-fdemo',m); el.setAttribute('data-fdemo-f',id); if(m!=='off') badge(el,'lock') }
      else if(!el.hasAttribute('data-fdemo')) badge(el,'note',limitOf(id));
    }
  }
  /* what the app itself switched off for this edition (data-foff), and what it marks as limited (data-flim) */
  const sw=doc.getElementById('swStyle'); if(sw) sw.disabled=mode!=='hide';
  doc.querySelectorAll('[data-foff]').forEach(el=>{ const f=el.getAttribute('data-foff'); if(f==='auto'||el.hasAttribute('data-fdemo')) return;
    const folds=mode==='fold'&&el.parentElement&&el.parentElement.id==='rail';
    const m=folds?'fold':mode==='hide'?'off':'lock';
    el.setAttribute('data-fdemo',m); el.setAttribute('data-fdemo-f',f); if(m!=='off') badge(el,'lock'); });
  doc.querySelectorAll('[data-flim]').forEach(el=>{ if(!el.hasAttribute('data-fdemo')) badge(el,'note',limitOf(el.getAttribute('data-flim'))); });
  writeFolds(doc);
  if(obs) obs.observe(doc.body,{childList:true,subtree:true});
}
/* one More per rail group (the groups are what the rail's dividers separate), after the group's last item */
function railGroups(doc){
  const rail=doc.getElementById('rail'); if(!rail) return [];
  const gs=[[]]; for(const c of rail.children){ if(c.classList.contains('rdiv')||c.classList.contains('rspacer')) gs.push([]); else if(c.tagName==='BUTTON'&&!c.classList.contains('fdemo-fold')) gs[gs.length-1].push(c) }
  return gs;
}
function writeFolds(doc){
  doc.querySelectorAll('.fdemo-fold').forEach(b=>b.remove());
  const rail=doc.getElementById('rail'); if(rail) rail.classList.toggle('fdemo-foldmode',mode==='fold');
  if(mode!=='fold'){openGroups.clear(); doc.querySelectorAll('.fdemo-shown').forEach(e=>e.classList.remove('fdemo-shown')); return}
  railGroups(doc).forEach((items,g)=>{
    const hidden=items.filter(el=>el.getAttribute('data-fdemo')==='fold'); if(!hidden.length) return;
    const shown=items.filter(el=>doc.defaultView.getComputedStyle(el).display!=='none'||el.getAttribute('data-fdemo')==='fold');
    const last=shown[shown.length-1]||items[items.length-1];
    const b=doc.createElement('button'); b.className='re fdemo-fold'+(openGroups.has(g)?' open':''); b.dataset.g=g; b.type='button';
    b.title=openGroups.has(g)?'Fold away':`${hidden.length} more in other editions`;
    b.innerHTML=`<svg class="fdemo-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg><span class="rl">${hidden.length} more</span>`;
    last.after(b);
    hidden.forEach(el=>el.classList.toggle('fdemo-shown',openGroups.has(g)));
  });
}
/* opening and closing, smoothly. The layout changes ONCE per movement and only transform and opacity are animated.
   Opening (FLIP): the items are laid out in their places; what is below slides down from where it was; each item
   fades and settles in as the sliding rows uncover it - its delay follows its place in the group.
   Closing: the end positions are measured first; what is below slides up while the items fade out, the lowest
   first; the items leave the layout only when the motion ends, in the same frame. A click while moving is ignored. */
const OUT='cubic-bezier(.16,1,.3,1)', INOUT='cubic-bezier(.65,0,.35,1)';
let folding=false;
function toggleFold(btn){
  if(folding) return;
  const doc=frame.contentDocument, w=frame.contentWindow, g=+btn.dataset.g, rail=doc.getElementById('rail');
  const items=railGroups(doc)[g].filter(el=>el.getAttribute('data-fdemo')==='fold'); if(!items.length) return;
  const open=!openGroups.has(g); open?openGroups.add(g):openGroups.delete(g);
  btn.classList.toggle('open',open); btn.title=open?'Fold away':`${items.length} more in other editions`;
  const movers=[...rail.children].filter(el=>!items.includes(el)&&w.getComputedStyle(el).display!=='none');
  const tops=els=>new Map(els.map(el=>[el,el.getBoundingClientRect().top]));
  const show=on=>items.forEach(el=>el.classList.toggle('fdemo-shown',on));
  [...movers,...items].forEach(el=>el.style.willChange='transform, opacity');
  const done=anims=>{folding=true; return Promise.all(anims.map(a=>a.finished.catch(()=>{}))).then(()=>{
    [...movers,...items].forEach(el=>el.style.willChange=''); folding=false})};
  const T=open?820:600;                                  // a bit slower (2 Oct)
  if(open){
    const a=tops(movers); show(true); const b=tops(movers);
    const shift=Math.max(1,...movers.map(el=>b.get(el)-a.get(el)));
    const first=Math.min(...items.map(el=>el.getBoundingClientRect().top));
    const anims=movers.filter(el=>Math.abs(a.get(el)-b.get(el))>.5)
      .map(el=>el.animate([{transform:`translateY(${a.get(el)-b.get(el)}px)`},{transform:'translateY(0)'}],{duration:T,easing:OUT}));
    items.forEach(el=>{
      const f=Math.min(1,(el.getBoundingClientRect().top-first)/shift);      // where it sits: 0 at the top of the opening
      anims.push(el.animate([{opacity:0,transform:'translateY(-10px) scale(.985)'},{opacity:1,transform:'none'}],
        {duration:T-80,delay:50+f*T*.45,easing:OUT,fill:'backwards'}));
    });
    done(anims);
  } else {
    const a=tops(movers); show(false); const b=tops(movers); show(true);      // the end positions, measured before moving
    const shift=Math.max(1,...movers.map(el=>a.get(el)-b.get(el)));
    const first=Math.min(...items.map(el=>el.getBoundingClientRect().top));
    const anims=movers.filter(el=>Math.abs(a.get(el)-b.get(el))>.5)
      .map(el=>el.animate([{transform:'translateY(0)'},{transform:`translateY(${b.get(el)-a.get(el)}px)`}],{duration:T,easing:INOUT,fill:'forwards'}));
    items.forEach(el=>{
      const f=Math.min(1,(el.getBoundingClientRect().top-first)/shift);
      anims.push(el.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-8px) scale(.985)'}],
        {duration:T*.55,delay:(1-f)*T*.3,easing:INOUT,fill:'forwards'}));   // the lowest first, as the rows below rise over it
    });
    done(anims).then(()=>{show(false); anims.forEach(x=>x.cancel())});      // leave the layout and drop the motion in one frame
  }
}
const later=()=>{clearTimeout(timer);timer=setTimeout(apply,120)};

/* a locked door does nothing but explain itself */
function guard(e){
  const fb=e.target&&e.target.closest&&e.target.closest('.fdemo-fold');
  if(fb){ e.preventDefault(); e.stopImmediatePropagation(); if(e.type==='click') toggleFold(fb); return }
  const el=e.target&&e.target.closest&&e.target.closest('[data-fdemo="lock"],[data-fdemo="fold"]'); if(!el) return;
  e.preventDefault(); e.stopImmediatePropagation();
  if(e.type==='click') openSheet(el.getAttribute('data-fdemo-f'));
}
frame.addEventListener('load',()=>{
  const w=frame.contentWindow;
  ['pointerdown','mousedown','mouseup','click','dblclick','contextmenu','touchstart'].forEach(t=>w.addEventListener(t,guard,true));
  obs=new w.MutationObserver(later);
  apply();
  if(first){first=false; setTimeout(()=>{const p=frame.contentDocument.getElementById('railRepertoire'); if(p) p.click()},700)}   // Free starts in Play
});

/* ---- the upgrade sheet (a draft: nothing like it exists in the app yet) */
function openSheet(id){
  const f=feat(id)||{n:id}, t=tierFor(id);
  // what the tier ADDS (not in Free at all) and the Free limits it LIFTS are two different lists
  const more=t?D.features.filter(x=>x.id!==id&&level(x.id)==='off'&&raw(t,x.id)===true).map(x=>x.n):[];
  const lifts=t?D.features.filter(x=>level(x.id)==='limited'&&raw(t,x.id)===true).map(x=>x.n):[];
  const el=document.getElementById('sheet');
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${f.n}">
    <div class="lockc">${LOCK}</div>
    <h2>${f.n}</h2>
    <p class="tier">${t?`Included in ${tierName(t)}`:`Not part of ${tierName(ed)}`}</p>
    ${more.length?`<h4>${tierName(t)} also adds</h4><ul>${more.slice(0,7).map(n=>`<li>${n}</li>`).join('')}${more.length>7?`<li>and ${more.length-7} more</li>`:''}</ul>`:''}
    ${lifts.length?`<h4>No limits on</h4><p class="lifts">${lifts.join(' \u00b7 ')}</p>`:''}
    <div class="acts"><button class="btn" data-close>Not now</button>${t?`<button class="btn primary" data-plans>See the plans</button>`:''}</div>
    <p class="demo">Demo: no purchase happens here.</p></div>`;
  el.hidden=false;
}
document.getElementById('sheet').addEventListener('click',e=>{
  if(e.target.id==='sheet'||e.target.closest('[data-close]')) e.currentTarget.hidden=true;
  else if(e.target.closest('[data-plans]')) toast('The plans page is not designed yet');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape') document.getElementById('sheet').hidden=true});

/* ---- the bar */
function renderEds(){
  document.getElementById('eds').innerHTML=ORDER.filter(id=>D.editions.some(e=>e.id===id))
    .map(id=>`<button data-ed="${id}" aria-pressed="${id===ed}">${tierName(id)}</button>`).join('');
}
function setEd(e){ed=e;try{localStorage.setItem('fdemo.ed',e)}catch(x){}
  renderEds(); document.getElementById('sheet').hidden=true; loadApp();   // the app opens again as this edition
  const p=document.getElementById('limPanel'); if(!p.hidden) fillPanel();
  if(!document.getElementById('cmpPanel').hidden) fillCmp();   // the comparison tints the edition in view
  // a room this edition locks or hides is left for Play
  const doc=frame.contentDocument, cur=doc&&doc.querySelector('[id^=rail].on');
  if(cur&&cur.hasAttribute('data-fdemo')){const pl=doc.getElementById('railRepertoire'); if(pl) pl.click()}
}
document.getElementById('eds').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) setEd(b.dataset.ed)});
function setMode(m){mode=m;try{localStorage.setItem('fdemo.mode',m)}catch(e){}
  document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
  apply()}
document.getElementById('mode').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) setMode(b.dataset.mode)});
function setNotes(n){notes=n;try{localStorage.setItem('fdemo.notes',n)}catch(e){}
  document.querySelectorAll('#notes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.notes===n));
  apply()}
document.querySelectorAll('#notes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.notes===notes));
function setStyle(v){appStyle=v;try{localStorage.setItem('fdemo.style',v)}catch(e){}
  document.querySelectorAll('#style button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.style===v));
  loadApp()}   // the app opens again in that style
document.querySelectorAll('#style button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.style===appStyle));
document.getElementById('style').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) setStyle(b.dataset.style)});
document.getElementById('notes').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) setNotes(b.dataset.notes)});
document.getElementById('limBtn').addEventListener('click',()=>{const p=document.getElementById('limPanel'); if(p.hidden){ fillPanel(); document.getElementById('cmpPanel').hidden=true; } p.hidden=!p.hidden});
function fillPanel(){
  const lim=D.features.filter(f=>level(f.id)==='limited');
  const known=(frame.contentWindow&&frame.contentWindow.HPS_SW)||[];   // what the app switches itself
  const doorless=D.features.filter(f=>level(f.id)==='off'&&!(MAP[f.id]||[]).length&&!known.includes(f.id));
  document.getElementById('limPanel').innerHTML=`
    <h3>Limited in ${tierName(ed)}</h3><p>Shown as notes; not enforced in this demo.</p>
    ${lim.length?'':'<p>None.</p>'}<ul>${lim.map(f=>`<li>${f.n}: <span class="n">${limitOf(f.id)}</span></li>`).join('')}</ul>
    <h3>Not in ${tierName(ed)}, with no door of its own here</h3><p>They live inside a room or a menu this edition does not open, or have no switch in the app yet.</p>
    ${doorless.length?'':'<p>None.</p>'}<ul>${doorless.map(f=>`<li>${f.n}</li>`).join('')}</ul>`;
}
/* ---- THE COMPARISON: an edition's cell the Switchboard's way - a row whose needs are off is off; an add-on cell marks what it adds */
function cellIn(e,id,seen){ const f=feat(id); if(!f) return 'on'; const v=raw(e,id); if(!v) return 'off'; seen=seen||new Set(); if(seen.has(id)) return 'on'; seen.add(id);
  if((f.needs||[]).some(n=>feat(n)&&cellIn(e,n,seen)==='off')) return 'off'; return v==='limited'?'limited':'on'; }
function fillCmp(){
  const eds=ORDER.filter(id=>D.editions.some(e=>e.id===id)), adds=(D.addons||[]);
  const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const head='<tr><th>Feature</th>'+eds.map(id=>{ const e=D.editions.find(x=>x.id===id)||{}; return '<th class="'+(id===ed?'cur':'')+'">'+esc(e.name||id)+'<small>'+esc(e.sold||e.sub||'')+'</small></th>'; }).join('')
    +adds.map(a=>'<th>'+esc(a.name)+'<small>add-on</small></th>').join('')+'</tr>';
  let body='', g=null; const span=1+eds.length+adds.length;
  if((D.unlisted||[]).length) body+='<tr class="grp"><td colspan="'+span+'">In every edition</td></tr><tr><td>'+(D.unlisted||[]).map(f=>esc(f.n)).join(' · ')+'</td>'+eds.map(id=>'<td class="yes'+(id===ed?' cur':'')+'">✓</td>').join('')+adds.map(()=>'<td class="no">–</td>').join('')+'</tr>';
  for(const f of D.features){ if(f.g!==g){ g=f.g; body+='<tr class="grp"><td colspan="'+span+'">'+esc(g)+'</td></tr>'; }
    body+='<tr><td>'+esc(f.n)+(f.st==='planned'?' <span class="fd">not built yet</span>':'')+'</td>'
      +eds.map(id=>{ const c=cellIn(id,f.id), cur=id===ed?' cur':'';
        return c==='on'?'<td class="yes'+cur+'">✓</td>':c==='limited'?'<td class="'+cur+'"><span class="lim">'+esc(((D.limits||{})[id]||{})[f.id]||'limited')+'</span></td>':'<td class="no'+cur+'">–</td>'; }).join('')
      +adds.map(a=>{ const v=raw(a.id,f.id); return v?'<td class="add">+</td>':'<td class="no">–</td>'; }).join('')+'</tr>'; }
  document.getElementById('cmpPanel').innerHTML='<div class="in"><div class="hd"><div><h2>Compare the editions</h2><p>What each edition has, from the Switchboard. Limited features show their limit; + is what an add-on brings.</p></div><button class="btn right" id="cmpClose">Close</button></div>'
    +'<div class="wrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div>';
  document.getElementById('cmpClose').addEventListener('click',()=>{document.getElementById('cmpPanel').hidden=true});
}
document.getElementById('cmpBtn').addEventListener('click',()=>{const c=document.getElementById('cmpPanel'); if(c.hidden){ fillCmp(); document.getElementById('limPanel').hidden=true; } c.hidden=!c.hidden});
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
