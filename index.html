<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Handpan Studio</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600&display=swap">
<style>
/* Handpan Studio v1 — single-theme (warm light), per the approved mockups.
   The score is a printed object: white card, brown edge, black/green inks. */
:root{
  --paper:#FBF9F6; --dust:#F1EDE6; --card:#FFFFFF; --card2:#FAF7F2;
  --ink:#1E1B16; --ink2:#5E5749; --ink3:#8D8578;
  --rule:#E4DCD0; --rule2:#EFE9E0;
  --dixie:#E59315; --dixie-soft:#FDF3E4; --amber-ink:#A9660A;
  --steel:#33607E; --steel-soft:#EBF1F5;
  --green:#3F8C50; --green-soft:#EDF4EE;
  --sc-bg:#FFFFFF; --sc-edge:#6B4A38; --sc-ink:#17150F; --sc-hand:#3F8C50;
  --sc-rule:#D9D2C6; --sc-count:#C6BEB1; --sc-band:#FBE7C6;
  --shadow:0 1px 2px rgba(70,52,28,.05), 0 14px 34px -16px rgba(70,52,28,.2);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:Figtree,"Helvetica Neue",Arial,sans-serif; font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; padding:14px clamp(10px,3vw,28px) 60px;
}
button{font:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--steel); outline-offset:2px; border-radius:4px}
.hidden{display:none !important}

/* ---- header ---- */
header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.brand{font-size:11px; font-weight:800; letter-spacing:.16em; color:var(--dixie); text-transform:uppercase}
#title{font-size:19px; font-weight:800; letter-spacing:-.015em; background:none; border:none; color:var(--ink);
  padding:2px 6px; border-radius:6px; min-width:60px}
#title:hover{background:var(--dust)}
.spacer{flex:1 1 auto}
.badge{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
  padding:4px 10px; border-radius:8px; background:var(--steel-soft); color:var(--steel);
  border:1px solid rgba(51,96,126,.25)}
.badge b{font-weight:700}

/* ---- controls ---- */
.ctl{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600;
  color:var(--ink2); background:var(--card); border:1px solid var(--rule); border-radius:9px;
  padding:7px 11px}
.ctl.on{background:var(--dixie-soft); border-color:var(--dixie); color:var(--ink)}
.ctl b{color:var(--ink); font-variant-numeric:tabular-nums}
select.ctl{appearance:auto; padding:6px 8px}
#panSel{max-width:290px}
.pills{display:inline-flex; background:var(--dust); border:1px solid var(--rule); border-radius:10px; padding:3px}
.pills button{font-size:13px; font-weight:600; border:none; background:none; color:var(--ink2);
  padding:6px 12px; border-radius:7px}
.pills button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(70,52,28,.15)}
.play{width:44px; height:44px; border-radius:50%; border:none; background:var(--dixie); color:#231703;
  display:grid; place-items:center; flex:none; box-shadow:0 3px 10px -3px rgba(229,147,21,.6)}
.play svg{display:block}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:10px 0}
.lab{font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3); margin-right:2px}
.chip{font-size:12.5px; font-weight:600; color:var(--ink2); background:var(--card);
  border:1px solid var(--rule); border-radius:999px; padding:4px 12px}
.chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.chip.playing{background:var(--dixie-soft); border-color:var(--dixie); color:var(--ink)}
.chip.loop{box-shadow:0 0 0 2px var(--dixie)}
input[type=number], input[type=text]{font:inherit; font-size:13px; border:1px solid var(--rule);
  border-radius:8px; padding:6px 9px; background:var(--card); color:var(--ink); width:64px}
input[type=text]{width:auto}

/* ---- the score ---- */
#scorewrap{overflow-x:auto; padding-bottom:4px}
.score{min-width:540px; max-width:980px; background:var(--sc-bg); border:1.5px solid var(--sc-edge);
  border-radius:13px; padding:12px 14px 14px; font-family:"Atkinson Hyperlegible",Figtree,sans-serif;
  box-shadow:var(--shadow)}
.secrow{display:flex; align-items:center; gap:8px; margin:10px 0 4px}
.secrow:first-child{margin-top:0}
.secname{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3)}
.count{display:grid; margin-bottom:5px}
.count span{text-align:center; font-size:17px; font-weight:700; color:var(--sc-count); font-variant-numeric:tabular-nums}
.bar{display:grid; gap:0}
.beat{display:grid; align-items:end; border:1px solid var(--sc-rule); margin:0 -1px -1px 0; padding:6px 1px 5px; min-height:46px; position:relative}
.beat.band{background:var(--sc-band)}
.slot{display:flex; flex-direction:column-reverse; align-items:center; justify-content:flex-start;
  min-height:34px; border-radius:4px; padding:1px 0; position:relative}
.slot.cursor{outline:2px solid var(--steel); outline-offset:0}
.slot.now{outline:2px solid var(--dixie); outline-offset:0; background:var(--sc-band)}
.sym{font-size:23px; font-weight:700; line-height:1.02; color:var(--sc-ink); font-variant-numeric:tabular-nums}
/* glyphs breathe with slot density: alone large, stacked smaller */
.slot.n1 .sym{font-size:27px}
.slot.n2 .sym{font-size:20px}
.slot.n3 .sym{font-size:16px; line-height:1.08}
.slot.n1 .sym.gh{font-size:20px}
.slot.n2 .sym.gh,.slot.n3 .sym.gh{font-size:15px}
.sym.r{color:var(--sc-hand)}
.sym.gh{font-size:17px; line-height:1.15}
.sym.pc{font-size:21px}
.sym.ot::after{content:"˚"; font-size:12px; vertical-align:top}
.sym.mu{font-size:21px}
.chordlab{position:absolute; top:-2px; left:0; right:0; text-align:center; font-size:10.5px;
  font-weight:700; color:var(--ink3); font-family:Figtree,sans-serif; pointer-events:none}
.slot.haschord{padding-top:12px}

/* ---- chord row ---- */
#chordwrap{overflow-x:auto; margin-top:10px; padding-bottom:4px; max-width:980px; text-align:center}
.chordframe{min-width:0; display:inline-block; padding:12px 18px 14px}
.chordrow{display:flex; gap:14px; justify-content:center; align-items:flex-end;
  flex-wrap:wrap}
.cchipwrap{display:flex; flex-direction:column; align-items:center; gap:2px}
.cname{font-family:Caveat,cursive; font-size:19px; font-weight:600; color:var(--ink2); line-height:1}
.fl{font-size:.68em; vertical-align:.28em}
.cname.inf{color:var(--ink3); font-style:italic}
.chordlab.inf{color:var(--ink3); font-style:italic}
.cchip{border:1.5px solid var(--sc-edge); border-radius:12px; padding:7px 12px 8px;
  display:flex; flex-direction:column-reverse; align-items:center; gap:1px;
  background:var(--sc-bg); min-width:34px}
.cchip.playing{background:var(--sc-band)}
.cchip .sym{font-size:19px; line-height:1.05}

/* ---- transposition report ---- */
#report{background:var(--card2); border:1px solid var(--rule); border-radius:12px; padding:13px 15px; margin-top:12px}
.fitline{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.fitpc{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums}
.fitsum{font-size:13px; color:var(--ink2)}
table.map{border-collapse:collapse; margin-top:10px; font-size:13px; width:100%; max-width:640px}
table.map th{font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--ink3); text-align:left; padding:3px 10px 3px 0; border-bottom:1px solid var(--rule)}
table.map td{padding:4px 10px 4px 0; border-bottom:1px solid var(--rule2); font-variant-numeric:tabular-nums}
.tagx{font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border-radius:5px}
.tagx.exact{background:var(--green-soft); color:var(--green)}
.tagx.octave{background:var(--steel-soft); color:var(--steel)}
.tagx.sub{background:var(--dixie-soft); color:var(--amber-ink)}
.tagx.drop{background:var(--dust); color:var(--ink3)}
table.map select{font-size:12.5px; border:1px solid var(--rule); border-radius:6px; padding:2px 4px; background:var(--card)}
.warn{margin-top:9px; font-size:13px; color:var(--ink2); background:var(--dixie-soft);
  border:1px solid rgba(229,147,21,.35); border-radius:9px; padding:8px 11px}

/* ---- editor ---- */
#editbar{background:var(--card2); border:1px solid var(--rule); border-radius:12px; padding:12px 14px; margin-top:12px}
.pal{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:6px 0}
.key{font-size:12.5px; font-weight:600; padding:6px 10px; border-radius:8px;
  border:1px solid var(--rule); background:var(--card); color:var(--ink2)}
.key.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.key.hl{background:var(--green); color:#fff; border-color:var(--green)}
.hint{font-size:12px; color:var(--ink3); margin-top:6px}
#pansvg{max-width:230px}

/* ---- dialogs ---- */
dialog{border:1px solid var(--rule); border-radius:14px; padding:18px; background:var(--card);
  color:var(--ink); box-shadow:var(--shadow); max-width:min(92vw,520px)}
dialog::backdrop{background:rgba(30,27,22,.35)}
dialog.flat[open]{position:fixed; top:9vh; left:50%; transform:translateX(-50%);
  z-index:60; margin:0; max-height:78vh; overflow:auto}
#dlgShade{position:fixed; inset:0; background:rgba(30,27,22,.35); z-index:55}
dialog h3{margin:0 0 10px; font-size:16px}
dialog textarea{width:100%; min-height:70px; font-family:ui-monospace,monospace; font-size:12px;
  border:1px solid var(--rule); border-radius:8px; padding:8px}
.list{max-height:300px; overflow:auto; margin:8px 0}
.lrow{display:flex; align-items:center; gap:8px; padding:6px 2px; border-bottom:1px solid var(--rule2); font-size:13.5px}
.lrow .nm{flex:1; font-weight:600}
#toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink);
  color:var(--paper); font-size:13px; padding:8px 16px; border-radius:9px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:9}
#toast.show{opacity:1}
@media (max-width:640px){ body{padding:10px 8px 50px} .score{min-width:480px} }
</style>
</head>
<body>

<header>
  <span class="brand">Handpan Studio</span>
  <input id="title" value="" aria-label="Piece title">
  <span class="spacer"></span>
  <button class="ctl" id="libBtn">Library</button>
  <button class="ctl" id="shareBtn">Share…</button>
  <button class="ctl" id="editBtn">Edit</button>
</header>

<div class="row">
  <span class="badge">Written for <b id="srcPanName"></b></span>
  <span class="lab" style="margin-left:8px">My pan</span>
  <select class="ctl" id="panSel" aria-label="My pan"></select>
  <button class="ctl" id="panNew">＋ My own pan…</button>
  <span class="spacer"></span>
  <div class="pills" role="group" aria-label="Playback mode">
    <button id="modePos" aria-pressed="true">By position</button>
    <button id="modeTrans" aria-pressed="false">Transposed</button>
  </div>
</div>

<div id="scorewrap"><div class="score" id="score"></div></div>
<div id="chordwrap" class="hidden"><div class="score chordframe" id="chordbox"></div></div>

<div class="row" id="secnav">
  <span class="lab">Arrangement</span>
  <span id="arrChips" style="display:inline-flex;gap:5px;flex-wrap:wrap"></span>
  <span class="lab" style="margin-left:14px" id="subLab">Table</span>
  <span id="subChips" style="display:inline-flex;gap:5px;flex-wrap:wrap"></span>
</div>

<div class="row" id="transport">
  <button class="play" id="playBtn" aria-label="Play">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.6l13 7.4-13 7.4z"/></svg>
  </button>
  <label class="ctl"><b><input type="number" id="bpm" min="30" max="200" step="1" style="border:none;width:44px;padding:0;font-weight:700;background:none"></b>BPM</label>
  <button class="ctl" id="countBtn">Count-in</button>
  <button class="ctl" id="halfBtn">Half speed</button>
  <button class="ctl" id="chordBtn">Chords</button>
  <button class="ctl" id="metBtn">Metronome</button>
  <label class="ctl">Swing <input type="range" id="swing" min="0" max="100" step="5" style="width:78px"> <b id="swingVal">0%</b></label>
  <button class="ctl" id="takBtn" title="Show tak as T or K">Tak: <b id="takGl">T</b></button>
  <span class="spacer"></span>
  <span class="hint">Space bar: play / pause</span>
</div>

<div class="row hidden" id="syncbar">
  <span class="lab">Video</span>
  <span class="badge"><b id="vtime">–:––</b></span>
  <button class="ctl" id="followBtn">Follow video</button>
  <button class="ctl" id="folMute">Sound: off</button>
  <button class="ctl" id="tapBtn">Tap bar 1</button>
  <button class="ctl" id="tapUndo">Undo tap</button>
  <button class="ctl" id="tapClear">Clear map</button>
  <span class="hint" id="syncInfo"></span>
</div>

<div id="report" class="hidden"></div>
<div id="editbar" class="hidden"></div>

<dialog id="shareDlg">
  <h3>Share this piece</h3>
  <div class="row" style="margin-top:0">
    <button class="ctl" id="cpCode">Copy code</button>
    <button class="ctl" id="cpLink">Copy link</button>
    <button class="ctl" id="dlFile">Save .hps file</button>
    <button class="ctl" id="impFile">Import file…</button>
    <input type="file" id="impFileInput" accept=".hps,.hpd,.txt" class="hidden">
  </div>
  <p class="hint">Paste a code, a link, or the contents of a .hpd file to import:</p>
  <textarea id="impTxt" placeholder="HPS1:…"></textarea>
  <div class="row"><button class="ctl on" id="impBtn">Import</button>
  <span class="spacer"></span><button class="ctl" id="shareClose">Close</button></div>
</dialog>

<dialog id="libDlg">
  <h3>Library</h3>
  <div class="list" id="libList"></div>
  <div class="row"><button class="ctl on" id="saveBtn">Save current piece</button>
  <span class="spacer"></span><button class="ctl" id="libClose">Close</button></div>
</dialog>

<dialog id="panDlg">
  <h3>My own pan</h3>
  <div class="row"><span class="lab">Name</span><input type="text" id="npName" placeholder="My C# Amara 9"></div>
  <div class="row"><span class="lab">Ding</span><input type="text" id="npDing" placeholder="C#3" style="width:70px"></div>
  <div class="row"><span class="lab">Fields</span><input type="text" id="npFields" placeholder="G#3 A3 C#4 D#4 E4 F#4 G#4 A4 C#5" style="flex:1"></div>
  <p class="hint">Notes low to high, 1 → highest. Sharps # or flats b both work.</p>
  <div class="row"><button class="ctl on" id="npSave">Save pan</button>
  <span class="spacer"></span><button class="ctl" id="npClose">Cancel</button></div>
</dialog>

<div id="dlgShade" class="hidden"></div>
<div id="toast" role="status"></div>
<script src="bank.js?v=2"></script>
<script>
"use strict";
/* Access gate for the public Pages host: the Kajabi iframe carries ?k=…, a
   student's browser remembers it, and casual visitors see a lock note.
   localhost and file:// stay open for development. */
const EMBED_KEY="ce0f3bf87594bda9";
(function(){
  const local=location.protocol==="file:"||/^(localhost|127\.)/.test(location.hostname);
  if(local) return;
  const given=new URLSearchParams(location.search).get("k")||localStorage.getItem("hps.k");
  if(given===EMBED_KEY){ try{localStorage.setItem("hps.k",given)}catch(e){} return; }
  document.addEventListener("DOMContentLoaded",()=>{
    document.body.innerHTML='<div style="max-width:420px;margin:18vh auto;text-align:center;font-family:Figtree,sans-serif"><h2>Handpan Studio</h2><p>This player is part of David Kuckhermann\'s courses.<br>Please open it from your lesson page.</p></div>';
  });
  throw new Error("no key");
})();
/* ================================================================
   Handpan Studio v1 — engine + player + editor, one file.
   Audio graph, sink and scheduler pattern copied/adapted from
   World Groove Grid (repo world-groove-grid, commit 766fdb3,
   play.html / AUDIO-ENGINE.md). One-shots only: the WGG splice
   engine (warpCell etc.) is deliberately NOT here.
   ================================================================ */

const $=id=>document.getElementById(id);
/* WebKit inside a cross-origin iframe can render a modal <dialog> whose top
   layer never receives clicks (the Kajabi library bug, 26 Aug 2026). When
   framed, dialogs open as plain fixed overlays instead — same look, no top
   layer to break. */
const FLAT_DLG=window!==window.top;
function openDlg(d){
  if(!FLAT_DLG){ d.showModal(); return; }
  d.classList.add("flat"); $("dlgShade").classList.remove("hidden"); d.show();
}
document.addEventListener("DOMContentLoaded",()=>{
  for(const d of document.querySelectorAll("dialog"))
    d.addEventListener("close",()=>$("dlgShade").classList.add("hidden"));
  $("dlgShade").addEventListener("click",()=>{
    document.querySelectorAll("dialog[open]").forEach(d=>d.close()); });
});
let _errShown=0;
window.addEventListener("error",e=>{ if(window!==window.top&&_errShown<3){ _errShown++;
  try{ toast("Error: "+(e.message||"unknown")); }catch(_){}}});
const toastEl=$("toast"); let toastT=null;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove("show"),2400); }

/* ---------------- pitch ---------------- */
const PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function midiOf(s){
  const m=String(s).trim().match(/^([A-Ga-g])([#♯b♭]?)(-?\d)$/);
  if(!m) return null;
  let v=PC[m[1].toUpperCase()];
  if(m[2]==="#"||m[2]==="♯") v++;
  if(m[2]==="b"||m[2]==="♭") v--;
  return 12*(+m[3]+1)+v;
}
const PCN=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
const nameOf=m=>PCN[((m%12)+12)%12]+(Math.floor(m/12)-1);

/* ---------------- pans ---------------- */
const BUILTIN_PANS=[
 {id:"d-kurd-9",   name:"D Kurd 9",           ding:"D3", fields:["A3","B♭3","C4","D4","E4","F4","G4","A4","C5"]},
 {id:"e-amara-9",  name:"E Amara 9",          ding:"E3", fields:["B3","D4","E4","F♯4","G4","A4","B4","D5","E5"]},
 {id:"f-pygmy-9",  name:"F Low Pygmy 9",      ding:"F2", fields:["C3","E♭3","F3","G3","A♭3","C4","E♭4","F4","G4"]},
 {id:"c-harm-9",   name:"C Harmonic Minor 9", ding:"C3", fields:["G3","A♭3","B3","C4","D4","E♭4","F4","G4","C5"]},
 {id:"g-hijaz-9",  name:"G Hijaz 9",          ding:"G2", fields:["D3","E♭3","F♯3","G3","A3","B♭3","C4","D4","E♭4"]},
];
function userPans(){ try{return JSON.parse(localStorage.getItem("hps.pans")||"[]")}catch(e){return[]} }
function allPans(){ return BUILTIN_PANS.concat(userPans()); }
function panById(id){ return allPans().find(p=>p.id===id) || BUILTIN_PANS[0]; }

// Even circle, zigzag numbering (odds up one side, evens down the other) —
// so consecutive odd/even neighbours (5/3, 4/2) sit adjacent, matching how the
// stacks in David's notation are actually played.
function zigzag(n){
  const odds=[],evens=[];
  for(let i=1;i<=n;i++)(i%2?odds:evens).push(i);
  return odds.concat(evens.reverse());
}
function derive(pan){
  const ding=midiOf(pan.ding);
  const fields=pan.fields.map((s,i)=>({n:i+1,midi:midiOf(s),label:s}));
  const iv=f=>f===0?0:(fields[f-1]?fields[f-1].midi-ding:null); // semitones above ding
  const ring=zigzag(fields.length);
  const adj=new Set();
  const pair=(a,b)=>{adj.add(a+"|"+b);adj.add(b+"|"+a)};
  for(let k=0;k<ring.length;k++) pair(ring[k],ring[(k+1)%ring.length]);
  pair(0,1); pair(0,2);             // one hand can span the ding and a bottom field
  return {pan,ding,fields,iv,ring,adj,
    adjacent:(a,b)=>a===b||adj.has(a+"|"+b),
    midiFor:(f)=>f===0?ding:(fields[f-1]?fields[f-1].midi:null),
    labelFor:(f)=>f===0?pan.ding:(fields[f-1]?fields[f-1].label:"—")};
}

/* ---------------- synth voice (placeholder until David records) ----------------
   Handpan-ish: fundamental + octave (2f) + compound fifth (3f), tuned decays,
   a soft strike transient, slight stereo detune. Buffers are cached and played
   back exactly like recorded samples will be — the recorded bank drops in by
   replacing synthBuf/percBuf with lookups, nothing else changes.            */
let ctx=null;
const BUFC=new Map();
function noiseTick(d,sr,len,amp,lp){ let y=0;
  for(let i=0;i<len&&i<d.length;i++){ const x=(Math.random()*2-1)*amp*(1-i/len); y+=(x-y)*lp; d[i]+=y; } }
function renderTone(midi,art){
  const f=440*Math.pow(2,(midi-69)/12), sr=ctx.sampleRate;
  const A={ open:{dur:midi<52?3.6:midi<66?2.9:2.2, parts:[[1,1,1],[2,.55,.62],[3.01,.3,.4],[4.2,.05,.16]], pk:.5,  tick:.16},
            mute:{dur:.6,  parts:[[1,1,.16],[2,.4,.1]],                         pk:.4,  tick:.2},
            overtone:{dur:2.3, parts:[[1,.13,.7],[2,1,.55],[3.01,.28,.3]],      pk:.42, tick:.08},
            ghost:{dur:.4, parts:[[1,.6,.1],[2,.3,.08]],                        pk:.22, tick:.1} }[art]||null;
  if(!A) return null;
  const n=Math.floor(sr*A.dur), b=ctx.createBuffer(2,n,sr);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch), det=ch?1.0016:1;
    for(const [r,amp,dc] of A.parts){
      const w=2*Math.PI*f*r*det/sr, tau=Math.max(.03,A.dur*dc)*sr;
      const ph=Math.random()*.2;
      for(let i=0;i<n;i++) d[i]+=amp*Math.sin(w*i+ph)*Math.exp(-i/tau);
    }
    for(let i=0,at=.0025*sr;i<at;i++) d[i]*=i/at;              // 2.5 ms attack
    noiseTick(d,sr,.006*sr,A.tick,.18);                        // strike transient
    const fo=Math.min(n,.02*sr);
    for(let i=0;i<fo;i++) d[n-1-i]*=i/fo;                      // tail fade
  }
  // normalise to the art's target peak
  let p=0; for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);
    for(let i=0;i<d.length;i+=5){const v=Math.abs(d[i]); if(v>p)p=v;}}
  if(p>0){const g=A.pk/p; for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);
    for(let i=0;i<d.length;i++)d[i]*=g;}}
  return b;
}
function renderPerc(kind){
  const sr=ctx.sampleRate;
  const cfg={ slap:{dur:.16,pk:.42}, tak:{dur:.09,pk:.4}, knock:{dur:.18,pk:.45}, ghosttap:{dur:.09,pk:.16} }[kind];
  const n=Math.floor(sr*cfg.dur), b=ctx.createBuffer(2,n,sr);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch); let lp=0, prev=0;
    for(let i=0;i<n;i++){
      const t=i/n, x=(Math.random()*2-1)*Math.exp(-t*(kind==="tak"?26:14));
      if(kind==="tak"){ d[i]=x-prev; prev=x; }                    // bright: highpassed
      else { lp+=(x-lp)*(kind==="slap"?.28:.1); d[i]=lp; }        // slap mid, knock dark
    }
    if(kind==="knock"){ const f0=150; for(let i=0;i<n;i++){ const t=i/sr;
      d[i]+=.9*Math.sin(2*Math.PI*(f0-260*t)*t)*Math.exp(-t/.05);} }
    for(let i=0,at=.001*sr;i<at;i++) d[i]*=i/at;
  }
  let p=0; for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);
    for(let i=0;i<d.length;i++){const v=Math.abs(d[i]); if(v>p)p=v;}}
  if(p>0){const g=cfg.pk/p; for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);
    for(let i=0;i<d.length;i++)d[i]*=g;}}
  return b;
}
function synthBuf(midi,art){ const k=midi+"|"+(art||"open");
  if(!BUFC.has(k)) BUFC.set(k,renderTone(midi,art||"open")); return BUFC.get(k); }

/* ---- recorded bank (bank.js, built by make_bank.py from David's D Kurd take).
   Chromatic F2..C6; decoded lazily, synth fills in until a decode lands. ---- */
const BANKBUF=new Map(), BANKPEND=new Map();   // key -> decode promise
function bankDecode(key){
  if(!window.HPS_BANK||!HPS_BANK.samples[key]||BANKBUF.has(key)) return BANKPEND.get(key)||Promise.resolve();
  if(BANKPEND.has(key)) return BANKPEND.get(key);
  const p=fetch("data:audio/mp4;base64,"+HPS_BANK.samples[key])
    .then(r=>r.arrayBuffer()).then(ab=>ctx.decodeAudioData(ab))
    .then(b=>{ BANKBUF.set(key,b); BANKPEND.delete(key); })
    .catch(()=>BANKPEND.delete(key));
  BANKPEND.set(key,p); return p;
}
function bankBuf(key){ const b=BANKBUF.get(key); if(!b) bankDecode(key); return b||null; }
function preloadBank(){ // returns a promise: everything the current pan needs
  if(!ctx||!window.HPS_BANK||!myPan) return Promise.resolve();
  const ps=[];
  for(const f of [0,...myPan.fields.map(x=>x.n)]){
    const m=myPan.midiFor(f); ps.push(bankDecode("o"+m),bankDecode("m"+m)); }
  for(const p of ["takR","takL","slapR","slapL","knockR","knockL"]) ps.push(bankDecode("p_"+p));
  return Promise.allSettled(ps);
}
function clickBuf(accent){
  const k="click|"+(accent?1:0);
  if(BUFC.has(k)) return BUFC.get(k);
  const sr=ctx.sampleRate, n=Math.floor(sr*.05), b=ctx.createBuffer(1,n,sr);
  const d=b.getChannelData(0), f=accent?1800:1200;
  for(let i=0;i<n;i++) d[i]=Math.sin(2*Math.PI*f*i/sr)*Math.exp(-i/(sr*.006))*(accent?.3:.2);
  BUFC.set(k,b); return b;
}
function percBuf(kind){ const k="p|"+kind;
  if(!BUFC.has(k)) BUFC.set(k,renderPerc(kind)); return BUFC.get(k); }

let master=null, dry=null, wet=null, send=null, conv=null, limiter=null, sendOn=false;
function softClipCurve(){ // slope exactly 1 below the knee — cannot colour or boost
  const n=2048,c=new Float32Array(n),T=.72;
  for(let i=0;i<n;i++){const x=(i/(n-1))*2-1,a=Math.abs(x);
    c[i]=Math.sign(x)*(a<=T?a:T+(1-T)*Math.tanh((a-T)/(1-T)));}
  return c;
}
function makeIR(sec,dec){ // "it sounded beautiful and natural" — David, on WGG's reverb
  const n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,n,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);
    for(let i=0;i<n;i++){const t=i/n; d[i]=(Math.random()*2-1)*Math.pow(1-t,dec)*(1-Math.exp(-i/400));}}
  return b;
}
function setWet(p){ const w=p/100; wet.gain.value=w*1.1; dry.gain.value=1-w*.35;
  const want=w>.001; if(want===sendOn) return; sendOn=want;
  try{ want?send.connect(conv):send.disconnect(conv); }catch(e){} }
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const FRAMED_SAFARI=window!==window.top && /apple/i.test(navigator.vendor||"");
let iosSink=null;
function ensureSink(){ // Kajabi strips allow="autoplay"; a media-element sink unmutes framed Safari (WGG, 21 Aug 2026)
  if((!IOS&&!FRAMED_SAFARI)||!ctx) return;
  if(iosSink&&iosSink!=="failed"){ if(iosSink.paused) iosSink.play().catch(()=>{}); return; }
  if(iosSink==="failed") iosSink=null;
  try{ const dest=ctx.createMediaStreamDestination(); const el=new Audio();
    el.setAttribute("playsinline",""); el.srcObject=dest.stream;
    el.play().then(()=>{ master.disconnect(); master.connect(dest); iosSink=el; })
      .catch(()=>{ iosSink="failed"; });
  }catch(e){ iosSink="failed"; }
}
function ensureCtx(){
  if(ctx) return;
  ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:"playback"});
  master=ctx.createGain(); master.gain.value=.9; master.connect(ctx.destination);
  limiter=ctx.createWaveShaper(); limiter.curve=softClipCurve(); limiter.oversample="2x";
  limiter.connect(master);
  dry=ctx.createGain(); wet=ctx.createGain(); dry.connect(limiter); wet.connect(limiter);
  conv=ctx.createConvolver(); conv.buffer=makeIR(1.3,2.4); conv.connect(wet);
  send=ctx.createGain(); sendOn=false; setWet(16);
  ctx.onstatechange=()=>{ if(playing&&ctx.state!=="running") ctx.resume().catch(()=>{});
    if(playing&&iosSink&&iosSink!=="failed"&&iosSink.paused) iosSink.play().catch(()=>{}); };
}
let live=[];
function fire(buf,at,gain){
  if(!buf) return;
  const src=ctx.createBufferSource(); src.buffer=buf;
  const g=ctx.createGain(); g.gain.value=gain;
  src.connect(g); g.connect(dry); g.connect(send);
  src.start(Math.max(at,ctx.currentTime));
  live.push(g); if(live.length>120) live.splice(0,40);
  src.onended=()=>{ const i=live.indexOf(g); if(i>=0) live.splice(i,1); };
}

// Composition 1 — rebuilt 26 Aug from David's six tables (A1 A2 B1 B2
// Bridge1 Bridge2; "the structure is A1 A2 = A section, then B1 B2,
// Bridge 1 Bridge 2, and back to A1 A2"). A and B are triplet grids;
// the bridge is 3/4 shown two bars per row. Which table of each pair is
// "1" vs "2" was inferred musically (the cadence/transition table second)
// — David can correct.
const KK={g:"K"};
function trip(groups,chord){  // one triplet bar: [[a,b,c],...]x4, hands L L R
  const bar=[]; groups.forEach((g,i)=>{ const t=i*3;
    g.forEach((f,j)=>{ if(f===null)return;
      bar.push(F(t+j,f,j===2?"R":"L",(i===0&&j===0&&chord)?{chord}:null)); }); });
  return bar; }
function comp1(){
  const A1=[
   trip([[1,3,6],[1,3,6],[1,3,6],[1,3,8]],"Fmaj"),
   trip([[2,4,6],[2,4,6],[2,4,8],[2,4,9]],"B♭maj"),
   trip([[3,5,7],[3,5,7],[3,5,7],[3,5,7]],"Cmaj"),
   trip([[3,5,7],[3,5,7],[3,5,9],[3,5,8]],"Cmaj")];
  const A2=[A1[0],A1[1],A1[2],
   trip([[3,5,7],[3,5,7]],"Cmaj").concat([F(6,3,"L")])];
  const B1=[
   trip([[0,1,6],[0,1,6],[0,1,8],[0,1,7]],"Dmin"),
   trip([[2,4,6],[2,4,6],[2,4,7],[2,4,8]],"B♭maj"),
   trip([[3,5,7],[3,5,7],[3,5,7],[3,5,7]],"Cmaj"),
   trip([[3,5,7],[3,5,8],[3,5,9],[3,5,8]],"Cmaj")];
  const B2=[B1[0],B1[1],B1[2],
   [F(0,9,"R",{chord:"Cmaj"}),F(2,7,"L"),F(4,5,"L"),F(6,4,"R"),F(8,3,"L"),F(10,1,"R")]];
  const brA=c=>[F(0,0,"L",c?{chord:c}:null),G(1,"R"),P(2,"tak","L"),G(3,"R"),P(4,"tak","L"),G(5,"R")];
  const brB=()=>[F(0,0,"L"),G(1,"R"),G(2,"L"),P(3,"tak","R",KK),G(4,"L"),P(5,"tak","R",KK)];
  const Bridge1=[brA("Fmaj"),brB(),brA("B♭maj"),brB(),brA("Cmaj"),brB(),brA("Cmaj"),
   [F(0,0,"L"),P(2,"tak","L",{roll:true}),P(3,"tak","R",KK),P(4,"tak","L"),P(5,"tak","R",KK)]];
  const Bridge2=[brA("Fmaj"),brB(),brA("B♭maj"),brB(),brA("Cmaj"),brB(),brA("Cmaj"),
   [F(0,0,"L"),G(2,"R"),F(3,1,"L"),F(5,4,"R"),F(6,5,"L"),F(8,6,"R"),F(9,7,"L"),F(11,9,"R")]];
  // Bridge2's last row runs across both bars; encoded as one 12-pulse pair via bpr=2
  return { format:"hpd-1", id:"composition-1", title:"Composition 1",
    author:"David Kuckhermann", writtenFor:"d-kurd-9", tempo:70,
    meter:[4,4], sub:3, barsPerRow:1,

      Bridge1:{meter:[3,4],sub:2,barsPerRow:2,bars:Bridge1},
      Bridge2:{meter:[3,4],sub:2,barsPerRow:2,bars:Bridge2} },
    arrangement:["A1","A2","B1","B2","Bridge1","Bridge2","A1","A2"] };
}

// Composition 2 — rebuilt 26 Aug from David's eight files (Downloads,

// B section. Structure A B A B." All eight tables verified by reading the
// files. A tables are 8th-grids with chord stacks; B tables 16th-grids.
function comp2(){
  const st=(t,fs,chord)=>fs.map((f,i)=>F(t,f,i===0?"R":"L",chord?{chord}:null));
  // a slot entry may be one field or a small stack — a stack is always
  // separate events at the same t, never a list inside one event
  const at=(t,v)=>Array.isArray(v)?v.map(f=>F(t,f,"L")):[F(t,v,"L")];
  // A tables are a 16th grid though the header counts 8ths (David, 26 Aug).
  // The half-bar cell: stack ON the beat — pickup on the last 16th before
  // beat 2/4 — melody note ON beat 2/4 — trailing note on the plain offbeat
  // (2+ / 4+): stack(1) 3(a-of-1) 6(2) 1(2+) stack(3) 3(a-of-3) 8(4) 1(4+).
  const Abar=(top,chord)=>{
    const [s1,m1,g1,m2,s2,m3,g2,m4]=top;
    return [...st(0,s1,chord),...at(3,m1),F(4,g1,"R"),...at(6,m2),
            ...st(8,s2,null),...at(11,m3),F(12,g2,"R"),...at(14,m4)]; };
  const A1=[
   Abar([[6,1],3,6,1,[6,1],3,8,1],"Fmaj"),
   Abar([[6,2],4,6,2,[8,2],4,9,2],"B♭maj"),
   Abar([[7,3],5,7,3,[7,3],5,7,3],"Cmaj"),
   Abar([[7,3],5,7,3,[9,3],5,8,3],"Cmaj")];
  const A2=[A1[0],A1[1],A1[2],
   [...st(0,[7,3],"Cmaj"),...at(3,5),F(4,7,"R"),...at(6,3),...st(8,[7,3],null)]];
  const A3=[
   Abar([[6,3,1],[3,1],6,[3,1],[6,3,1],[3,1],8,[3,1]],"Fmaj"),
   Abar([[6,4,2],[4,2],6,[4,2],[8,4,2],[4,2],9,[4,2]],"B♭maj"),
   Abar([[7,5,3],[5,3],7,[5,3],[7,5,3],[5,3],7,[5,3]],"Cmaj"),
   Abar([[7,5,3],[5,3],7,[5,3],[9,5,3],[5,3],8,[5,3]],"Cmaj")];
  const A4=[A3[0],A3[1],A3[2],
   [...st(0,[7,5,3],"Cmaj"),...at(3,[5,3]),F(4,7,"R"),...at(6,[5,3]),...st(8,[7,5,3],null)]];
  // B rows, timing verified against the beat-cell highlights in David's
  // screenshots: chord stack on 1, ghost on the "+", a pickup 16th, the SLAP
  // ON BEAT 2, melody through beat 2, ghosts across beat 3, tail on beat 4.
  const Brow=(stack,pick,m1,m2,m3,tail,chord)=>{

    return bar.concat(tail); };
  const t938=[F(12,9,"R"),F(13,3,"L"),F(14,8,"R")];
  const B1=[
   Brow([6,1,0],"M",0,1,6,[F(12,8,"R"),F(13,0,"L"),F(14,7,"R")],"Dmin"),
   Brow([6,4,2],2,2,4,6,[F(12,7,"R"),F(13,2,"L"),F(14,8,"R")],"B♭maj"),
   Brow([7,5,3],3,3,5,7,[P(12,"slap","R"),F(13,3,"L"),F(14,9,"R")],"Cmaj"),
   Brow([7,5,3],3,3,5,8,t938.slice(),"Cmaj")];
  const B2=[B1[0],B1[1],B1[2],
   [...st(0,[7,5,3],"Cmaj"),G(2,"R"),F(3,3,"L"),P(4,"slap","R"),F(5,3,"L"),F(6,5,"L"),
    F(7,9,"R"),G(8,"L"),F(9,9,"R"),F(10,9,"L"),F(11,9,"R"),F(12,9,"L"),F(13,9,"L"),F(14,8,"R")]];
  const B3=[B1[0],B1[1],B1[2],
   Brow([7,5,3],3,3,5,7,t938.slice(),"Cmaj")];
  const B4=[B1[0],B1[1],B1[2],
   [...st(0,[7,5,3],"Cmaj"),G(2,"R"),F(3,3,"L"),P(4,"slap","R"),F(5,3,"L"),F(6,5,"L"),
    F(7,7,"R"),G(8,"L"),F(9,9,"R"),G(10,"L"),F(11,9,"R"),F(12,9,"L"),F(14,8,"R")]];
  return { format:"hpd-1", id:"composition-2", title:"Composition 2",
    author:"David Kuckhermann", writtenFor:"d-kurd-9", tempo:75,
    meter:[4,4], sub:4, barsPerRow:1,
    sections:{ A1:{bars:A1},A2:{bars:A2},A3:{bars:A3},A4:{bars:A4},
      B1:{bars:B1},B2:{bars:B2},B3:{bars:B3},B4:{bars:B4} },
    arrangement:["A1","A2","A3","A4","B1","B2","B3","B4",
                 "A1","A2","A3","A4","B1","B2","B3","B4"] };

// "Level 1 6.6" — from David's four tables (26 Aug). 3/4, header counts
// beats only, 8th grid beneath (the run row uses all six slots), two bars
// per row. Standard cell: stack on 1, note on 2, offbeat 8th on 2+, note
// on 3. A1 ends on 6/4+tak, A2 resolves to 6/D+tak; B2 carries the
// ascending run. Table order within sections and the arrangement (A B)
// are inferred — David to confirm. No chords notated at this level.
function level166(){
  const vb=(top,bot,a,off,b)=>[F(0,top,"R"),F(0,bot,"L"),F(2,a,"L"),F(3,off,"R"),F(4,b,"L")];
  const rDb=()=>vb(6,0,3,6,1), rDb2=()=>vb(6,0,5,4,3);
  const A1=[rDb(),rDb2(),rDb(),rDb2(),
    vb(6,1,2,6,3),vb(6,4,5,6,4),
    vb(6,3,2,6,1),[F(0,6,"R"),F(0,4,"L"),P(4,"tak","L")]];
  const A2=[rDb(),rDb2(),rDb(),rDb2(),
    vb(6,1,2,6,3),vb(6,4,5,6,4),
    vb(6,3,2,6,1),[F(0,6,"R"),F(0,0,"L"),P(4,"tak","L")]];
  const p41=()=>vb(4,1,1,4,1), p62=()=>vb(6,2,2,6,2),
        p73=()=>vb(7,3,3,7,3), p51=()=>vb(5,1,1,5,1);
  const B1=[p41(),p41(),p62(),p62(),p73(),p73(),p51(),p73()];
  const B2=[p41(),p41(),p62(),p62(),p73(),p51(),
    [F(0,0,"L"),F(2,1,"L"),F(3,2,"R"),F(4,3,"L"),F(5,4,"R")],
    [F(0,5,"L"),F(1,6,"R"),F(2,7,"L"),F(3,8,"R"),F(4,7,"L"),F(5,6,"R")]];
  return { format:"hpd-1", id:"level1-6-6", title:"Level 1 6.6",
    author:"David Kuckhermann", writtenFor:"d-kurd-9", tempo:63,
    meter:[3,4], sub:2, barsPerRow:2,
    sections:{ A1:{bars:A1}, A2:{bars:A2}, B1:{bars:B1}, B2:{bars:B2} },
    arrangement:["A1","A2","B1","B2","A1","A2","B1","B2"] };
}
DEMOS.splice(2,0,level166());

function SM(p,nm){ // section metrics: per-section meter/sub/barsPerRow over piece defaults
  const s=p.sections[nm]||{};
  const beats=(s.meter||p.meter)[0], sub=s.sub||p.sub;
  return {beats,sub,bp:beats*sub,bpr:s.barsPerRow||p.barsPerRow||1};
}
function pieceOk(p){ return p&&typeof p==="object"&&String(p.format||"").startsWith("hpd")
  &&p.sections&&Array.isArray(p.arrangement)&&p.arrangement.every(n=>p.sections[n]); }

/* ---------------- compile ---------------- */
function compile(piece){
  const byPulse=new Map(), secStarts=[]; let pulse=0;
  piece.arrangement.forEach((nm,ai)=>{
    const sec=piece.sections[nm], m=SM(piece,nm);
    secStarts.push({name:nm,ai,pulse,sub:m.sub,bp:m.bp,
      pulses:sec.bars.length*m.bp});
    for(const bar of sec.bars){
      for(const ev of bar){ const p=pulse+ev.t;
        if(!byPulse.has(p)) byPulse.set(p,[]);
        byPulse.get(p).push(ev); }
      pulse+=m.bp;
    }
  });
  return {byPulse,total:pulse||1,secStarts};
}
function secOfPulse(pi){ let cur=C.secStarts[0];
  for(const s of C.secStarts){ if(s.pulse<=pi) cur=s; else break; } return cur; }

/* ---------------- state ---------------- */
let piece=null, C=null, myPanId="d-kurd-9", myPan=null, srcPan=null;
let mode="pos", MAP=null, REPORT=null, overrides={};
let bpm=72, halfSpeed=false, countIn=false, takGlyph="T";
let metOn=(localStorage.getItem("hps.met")||"0")==="1";
let swing=+(localStorage.getItem("hps.swing")||0);
let playing=false, timer=null, raf=null, nextTime=0, nextPulse=0, lastPaint=-1, fired=[];
let loopSec=null;   // {from,to} in pulses, or null = whole piece
let editing=false, cursor=0, undoStack=[], viewSec=null, selAi=0;

function effBpm(){ return halfSpeed?bpm/2:bpm; }
function pulseDurOf(pi){ return 60/effBpm()/secOfPulse(pi).sub; }

/* ---------------- playback ---------------- */
function evGain(ev){
  if(ev.v==="ghost") return .5;
  if(ev.v==="perc") return .9;
  return ev.art==="ghost"?.4:1;
}
function fireEvent(ev,at){
  if(ev.v==="ghost") return;   // ghosts are notated, not sounded (David, 26 Aug: silent for now)
  if(ev.v==="perc"){
    const hand=ev.hand==="L"?"L":"R";
    const buf=bankBuf("p_"+ev.s+hand)||percBuf(ev.s==="tak"?"tak":ev.s);
    if(ev.roll) fire(buf,at-0.045,evGain(ev)*0.45);   // grace before the accent
    fire(buf,at,evGain(ev)); return;
  }
  let f=ev.f;
  if(mode==="trans"&&MAP){ f=MAP[f]; if(f===null||f===undefined) return; }
  const midi=myPan.midiFor(f);
  if(midi===null||midi===undefined) return;   // field missing on this pan
  const art=ev.art||"open";
  const buf=(art==="open"?bankBuf("o"+midi):art==="mute"?bankBuf("m"+midi):null)
    ||synthBuf(midi,art);
  if(ev.roll) fire(buf,at-0.045,evGain(ev)*0.45);
  fire(buf,at,evGain(ev));
}
function jumpTo(pulse){
  if(!playing){ return; }
  const now=ctx.currentTime;
  for(const g of live){ try{ g.gain.setValueAtTime(g.gain.value,now);
    g.gain.linearRampToValueAtTime(0,now+.05);}catch(e){} }
  live=[];
  if(loopSec&&(pulse<loopSec.from||pulse>=loopSec.to)) loopSec=null;
  nextPulse=loopSec?pulse-loopSec.from:pulse;
  nextTime=now+0.1; fired=[]; lastPaint=-1;
  renderArr();
}
function loopedPulse(n){
  if(!loopSec) return n%C.total;
  const span=loopSec.to-loopSec.from;
  return loopSec.from+(n%span);
}
function sched(){
  try{
    // after a stall (hidden tab), resync instead of firing every missed pulse
    if(nextTime<ctx.currentTime-0.5) nextTime=ctx.currentTime+0.06;
    while(nextTime<ctx.currentTime+0.4){
      const pi=loopedPulse(nextPulse);
      const sec=secOfPulse(pi), rel=pi-sec.pulse, m=SM(piece,sec.name);
      let at=nextTime;   // swing: the off subdivision leans toward the triplet
      if(swing>0&&m.sub%2===0&&(rel%2)===1) at+=swing/100*pulseDurOf(pi)/3;
      for(const ev of (C.byPulse.get(pi)||[])) fireEvent(ev,at);
      if(metOn&&rel%m.sub===0) fire(clickBuf(rel%m.bp===0),nextTime,1);
      fired.push({pi,at:nextTime}); if(fired.length>200) fired.splice(0,80);
      nextPulse++; nextTime+=pulseDurOf(pi);
    }
  }catch(e){ /* one bad pulse must never stop the clock (WGG rule) */ }
}
function paintPulse(pi){
  const cur=secOfPulse(pi);
  if(cur){ selAi=cur.ai;
    if(cur.name!==viewSec){ viewSec=cur.name; render(); } }    // the view follows the music
  document.querySelectorAll(".slot.now").forEach(el=>el.classList.remove("now"));
  document.querySelectorAll(".chip.playing").forEach(el=>el.classList.remove("playing"));
  if(cur){
    const rel=pi-cur.pulse;
    document.querySelectorAll('[data-rel="'+rel+'"]').forEach(el=>el.classList.add("now"));
    const chip=document.querySelector('[data-ai="'+cur.ai+'"]')||document.querySelector('[data-ai-'+cur.ai+']');
    if(chip) chip.classList.add("playing");
    document.querySelectorAll(".cchip.playing").forEach(el=>el.classList.remove("playing"));
    const bar=Math.floor(rel/SM(piece,cur.name).bp);
    const cc=document.querySelector('.cchip[data-cbar="'+bar+'"]');
    if(cc) cc.classList.add("playing");
  }
}
function tick(){
  if(!playing) return;
  const now=ctx.currentTime; let pi=-1;
  for(let i=fired.length-1;i>=0;i--) if(fired[i].at<=now){ pi=fired[i].pi; break; }
  if(pi>=0&&pi!==lastPaint){ lastPaint=pi; paintPulse(pi); }
  raf=requestAnimationFrame(tick);
}
async function togglePlay(){
  if(playing){ stop(); return; }
  ensureCtx();
  // the first stroke must already be the recorded pan, not the synth stand-in
  await Promise.race([preloadBank(), new Promise(r=>setTimeout(r,800))]);
  start();
}
function start(){
  ensureCtx(); ensureSink(); ctx.resume().catch(()=>{});
  preloadBank();
  C=compile(piece);
  const beat=60/effBpm(); let t0=ctx.currentTime+0.12;
  const cBeats=SM(piece,piece.arrangement[0]).beats;
  if(countIn){ for(let i=0;i<cBeats;i++) fire(clickBuf(i===0),t0+i*beat,1);
    t0+=cBeats*beat; }
  const e=arrEntries()[Math.min(selAi,piece.arrangement.length-1)];
  nextTime=t0; nextPulse=loopSec?0:(e?e.from:0); lastPaint=-1; fired=[];
  playing=true; timer=setInterval(sched,60); sched();
  raf=requestAnimationFrame(tick);
  $("playBtn").innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  $("playBtn").setAttribute("aria-label","Stop");
}
function stop(){
  playing=false; clearInterval(timer); cancelAnimationFrame(raf);
  const now=ctx?ctx.currentTime:0;
  for(const g of live){ try{ g.gain.setValueAtTime(g.gain.value,now);
    g.gain.linearRampToValueAtTime(0,now+.04);}catch(e){} }
  live=[];
  document.querySelectorAll(".slot.now").forEach(el=>el.classList.remove("now"));
  document.querySelectorAll(".chip.playing").forEach(el=>el.classList.remove("playing"));
  $("playBtn").innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.6l13 7.4-13 7.4z"/></svg>';
  $("playBtn").setAttribute("aria-label","Play");
}

/* ---------------- transposition ----------------
   Positions → intervals above the ding; one consistent decision per source
   field for the whole piece; hard playability constraints can veto a free
   match; every decision overridable (stored per piece+pan).             */
function fieldUsage(p){
  const u=new Map();
  for(const nm of p.arrangement){ const m=SM(p,nm);
    for(const bar of p.sections[nm].bars)
      for(const ev of bar){ if(ev.v!=="field") continue;
        const w=(ev.t%m.sub===0?2:1)+(ev.t===0?1:0);
        u.set(ev.f,(u.get(ev.f)||0)+w); } }
  return u;
}
function oneHandStacks(p){
  const out=[];
  for(const nm of p.arrangement) for(const bar of p.sections[nm].bars){
    const byT=new Map();
    for(const ev of bar){ if(ev.v!=="field") continue;
      const k=ev.t+"|"+ev.hand; if(!byT.has(k)) byT.set(k,[]); byT.get(k).push(ev.f); }
    for(const fs of byT.values()) if(fs.length>1) out.push(fs);
  }
  return out;
}
function candCost(si,ti){
  const d=ti-si;
  if(d===0) return {c:0,r:"exact"};
  if(Math.abs(d)%12===0) return {c:1,r:"octave"};
  const pc=((d%12)+12)%12, near=Math.min(pc,12-pc);
  if(near<=1) return {c:6,r:"sub"};             // same degree, other quality — mood changes
  return {c:3+near,r:"sub"};
}
function transpose(){
  const S=srcPan, T=myPan, use=fieldUsage(piece), stacks=oneHandStacks(piece);
  const srcFields=[...use.keys()].sort((a,b)=>use.get(b)-use.get(a));
  const tN=T.fields.length;
  const cands={};   // per src field: [{tf,c,r}...] + drop
  for(const sf of srcFields){
    if(sf===0){ cands[sf]=[{tf:0,c:0,r:"exact"}]; continue; }
    const si=S.iv(sf), list=[];
    for(let tf=1;tf<=tN;tf++) list.push(Object.assign({tf},candCost(si,T.iv(tf))));
    list.sort((a,b)=>a.c-b.c);
    list.push({tf:null,c:12,r:"drop"});
    cands[sf]=list;
  }
  const ov=overrides[myPanId]||{};
  function evalMap(m){
    let tot=0, viol=0;
    for(const sf of srcFields){
      if(m[sf]===null){ tot+=use.get(sf)*12; continue; }
      const e=cands[sf].find(x=>x.tf===m[sf]); tot+=use.get(sf)*(e?e.c:20);
    }
    // hard-ish constraints as heavy penalties
    for(const grp of stacks){
      const ts=grp.map(f=>m[f]).filter(t=>t!==null&&t!==undefined);
      if(ts.length<2) continue;
      for(let i=0;i<ts.length;i++) for(let j=i+1;j<ts.length;j++){
        if(ts[i]===ts[j]) viol++;
        else if(!T.adjacent(ts[i],ts[j])) viol++;
      }
    }
    const used=new Map();
    for(const sf of srcFields){ const t=m[sf];
      if(t!==null&&t!==undefined){ if(used.has(t)) tot+=2; used.set(t,1); } }
    return tot+viol*40;
  }
  // greedy start, then hill-climb over single reassignments
  const m={};
  for(const sf of srcFields) m[sf]=(sf in ov)?ov[sf]:cands[sf][0].tf;
  let best=evalMap(m);
  for(let pass=0;pass<6;pass++){
    let improved=false;
    for(const sf of srcFields){
      if(sf in ov) continue;
      const cur=m[sf];
      for(const cand of cands[sf]){
        if(cand.tf===cur) continue;
        m[sf]=cand.tf; const v=evalMap(m);
        if(v<best-1e-9){ best=v; improved=true; }
        else m[sf]=cur;
        if(m[sf]!==cur) break;
      }
    }
    if(!improved) break;
  }
  // report
  let wSum=0,fit=0; const rows=[];
  let nEx=0,nOc=0,nSub=0,nDrop=0;
  for(const sf of [...srcFields].sort((a,b)=>a-b)){
    const tf=m[sf], w=use.get(sf); wSum+=w;
    const e=tf===null?{c:12,r:"drop"}:cands[sf].find(x=>x.tf===tf)||{c:12,r:"drop"};
    fit+=w*(e.c===0?1:e.c===1?.85:e.c<=6?.55:e.c<12?.35:0);
    if(e.r==="exact")nEx++; else if(e.r==="octave")nOc++; else if(e.r==="drop")nDrop++; else nSub++;
    rows.push({sf,tf,r:e.r,c:e.c,w,locked:sf in ov});
  }
  const violStacks=[];
  for(const grp of stacks){
    const ts=grp.map(f=>m[f]).filter(t=>t!==null&&t!==undefined);
    let bad=false;
    for(let i=0;i<ts.length;i++) for(let j=i+1;j<ts.length;j++)
      if(ts[i]===ts[j]||!T.adjacent(ts[i],ts[j])) bad=true;
    if(bad) violStacks.push(grp);
  }
  MAP=m;
  REPORT={rows,fit:Math.round(100*fit/(wSum||1)),nEx,nOc,nSub,nDrop,violStacks,cands};
}

/* ---------------- video sync ----------------
   The lesson page posts {type:"hps-video-time", t:seconds} a few times a
   second (embed/teachable-snippet.html). The video drives the HIGHLIGHT
   only — the audio engine never follows it. The sync map is tap-authored:
   one anchor per bar start, linear interpolation between anchors, stored
   with the piece so it travels in shares. */
let videoT=null, videoSeen=false, follow=false, tapIdx=0;
let followMuted=true, vCursor=null;
const fmtT=x=>Math.floor(x/60)+":"+String(Math.floor(x%60)).padStart(2,"0");
function barStarts(){
  const out=[], c=compile(piece);   // never the cached C: it may belong to the previous piece
  for(const sec of c.secStarts){
    const s=piece.sections[sec.name]; if(!s) continue;
    for(let b=0;b<s.bars.length;b++) out.push(sec.pulse+b*sec.bp);
  }
  return out;
}
function segRate(t){ // pulses per second on the sync map's segment around t
  const a=piece.syncMap; if(!a||a.length<2) return 0;
  for(let i=0;i<a.length-1;i++)
    if(t<=a[i+1].t||i===a.length-2){
      if(t<a[i].t&&i===0) return 0;
      return (a[i+1].p-a[i].p)/Math.max(1e-6,a[i+1].t-a[i].t);
    }
  return 0;
}
function mapPulse(t){
  const a=piece.syncMap;
  if(!a||a.length<2) return null;
  if(t<=a[0].t) return a[0].p;
  for(let i=0;i<a.length-1;i++)
    if(t<=a[i+1].t){
      const f=(t-a[i].t)/Math.max(1e-6,a[i+1].t-a[i].t);
      return a[i].p+f*(a[i+1].p-a[i].p);
    }
  return a[a.length-1].p;
}
function barChordLabel(bar){
  const ev=bar.find(e=>e.chord);
  const asW=mode==="pos"&&myPanId===piece.writtenFor;
  if(ev&&asW) return {name:ev.chord,inf:false};
  const g=inferChord(bar);
  return g?{name:g,inf:!ev}:null;
}
function updateSyncUI(){
  const n=(piece.syncMap||[]).length, bs=barStarts();
  $("tapBtn").textContent=tapIdx>=bs.length?"All bars tapped":"Tap bar "+(tapIdx+1);
  $("syncInfo").textContent=n?(n+" anchor"+(n>1?"s":"")+(n>=2?" — map ready":" — need 2+")):"tap bar starts while the video plays — key T";
  $("followBtn").classList.toggle("on",follow);
}
window.addEventListener("message",e=>{
  const d=e.data; let t=null;
  if(typeof d==="number") t=d;
  else if(d&&typeof d==="object"){
    if(typeof d.t==="number"&&(d.type==="hps-video-time"||d.hps)) t=d.t;
    else if(typeof d.hpsTime==="number") t=d.hpsTime;
  }
  if(d&&d.type==="hps-bridge"){
    if(!videoSeen){ videoSeen=true; $("syncbar").classList.remove("hidden"); updateSyncUI(); }
    // once real timecodes flow, the heartbeat must not overwrite the clock
    if(videoT==null||d.status==="no-player")
      $("vtime").textContent=d.status==="connected"?"ready":
        d.status==="no-player"?"no player found":"searching…";
    return;
  }
  if(t==null||!isFinite(t)) return;
  videoT=t;
  if(!videoSeen){ videoSeen=true; $("syncbar").classList.remove("hidden"); updateSyncUI(); }
  $("vtime").textContent=fmtT(t);
  if(follow&&!playing){
    const p=mapPulse(t);
    if(p!=null){ if(!C) C=compile(piece); followTick(t,p); }
  }
});
function followTick(t,p){
  paintPulse(Math.round(p)%C.total);
  const rate=segRate(t);
  if(rate<=0.05){ vCursor=null; return; }        // outside the map: hold, silent
  if(vCursor==null||Math.abs(p-vCursor)>4){       // start or seek: resync
    const now=ctx?ctx.currentTime:0;
    for(const g of live){ try{ g.gain.setValueAtTime(g.gain.value,now);
      g.gain.linearRampToValueAtTime(0,now+.05);}catch(e){} }
    live=[]; vCursor=Math.ceil(p);
  }
  if(!ctx) return;
  const horizon=p+rate*0.4;                       // schedule 400 ms ahead
  while(vCursor<=horizon){
    const pi=((Math.round(vCursor)%C.total)+C.total)%C.total;
    const at=ctx.currentTime+(vCursor-p)/rate;
    if(!followMuted) for(const ev of (C.byPulse.get(pi)||[])) fireEvent(ev,Math.max(at,ctx.currentTime));
    vCursor++;
  }
}

/* ---------------- rendering ---------------- */
function glyphFor(ev,disp){
  if(ev.v==="ghost") return {t:"•",cls:"sym gh"};
  if(ev.v==="perc"){
    let g=ev.s==="slap"?"^":ev.s==="knock"?"°":(ev.g||"T");
    if(ev.roll) g+="\u0303";                       // combining tilde: a grace-note roll
    return {t:g,cls:"sym pc"};
  }
  let f=ev.f;
  if(disp&&mode==="trans"&&MAP){ f=MAP[f]; if(f===null||f===undefined) return {t:"–",cls:"sym gh"}; }
  let base=f===0?(ev.art==="mute"?"M":"D"):String(f);
  let cls="sym";
  if(ev.art==="overtone") cls+=" ot";
  if(ev.art==="mute"&&f!==0){ base+="<small>m</small>"; cls+=" mu"; }
  return {t:base,cls};
}
function locOf(pulse){
  let acc=0;
  for(const nm of piece.arrangement){
    const sec=piece.sections[nm], m=SM(piece,nm), secPulses=sec.bars.length*m.bp;
    if(pulse<acc+secPulses){
      const rel=pulse-acc;
      return {sec:nm,bar:Math.floor(rel/m.bp),t:rel%m.bp};
    }
    acc+=secPulses;
  }
  return null;
}
function render(){
  if(!piece.sections[viewSec]) viewSec=piece.arrangement[0];
  const nm=viewSec, sec=piece.sections[nm], m=SM(piece,nm);
  const sc=$("score"); sc.innerHTML="";
  const sr=document.createElement("div"); sr.className="secrow";
  sr.innerHTML='<span class="secname">'+nm+'</span>';
  sc.appendChild(sr);
  const cnt=document.createElement("div"); cnt.className="count";
  cnt.style.gridTemplateColumns="repeat("+m.bpr+",1fr)"; cnt.style.gap="0 14px";
  for(let r=0;r<m.bpr;r++){
    const cb=document.createElement("div");
    cb.style.display="grid"; cb.style.gridTemplateColumns="repeat("+m.bp+",1fr)";
    for(let t=0;t<m.bp;t++){
      const sp=document.createElement("span");
      sp.textContent=t%m.sub===0?String(t/m.sub+1):(m.sub%2===0&&t%m.sub===m.sub/2?"+":"·");
      cb.appendChild(sp);
    }
    cnt.appendChild(cb);
  }
  sc.appendChild(cnt);
  for(let b0=0;b0<sec.bars.length;b0+=m.bpr){
    const rowEl=document.createElement("div");
    rowEl.style.display="grid";
    rowEl.style.gridTemplateColumns="repeat("+m.bpr+",1fr)";
    rowEl.style.gap="0 14px";
    for(let bi=b0;bi<Math.min(b0+m.bpr,sec.bars.length);bi++){
      const bar=sec.bars[bi];
      const byT=new Map();
      for(const ev of bar){ if(!byT.has(ev.t)) byT.set(ev.t,[]); byT.get(ev.t).push(ev); }
      const bc=barChordLabel(bar);
      const bel=document.createElement("div"); bel.className="bar";
      bel.style.gridTemplateColumns="repeat("+m.beats+",1fr)";
      for(let b=0;b<m.beats;b++){
        const be=document.createElement("div"); be.className="beat";
        be.style.gridTemplateColumns="repeat("+m.sub+",1fr)";
        for(let sN=0;sN<m.sub;sN++){
          const t=b*m.sub+sN, rel=bi*m.bp+t;
          const sl=document.createElement("div"); sl.className="slot"; sl.dataset.rel=rel;
          const _n=(byT.get(t)||[]).length;
          if(_n) sl.classList.add(_n===1?"n1":_n===2?"n2":"n3");
          const evs=(byT.get(t)||[]).slice(0,4)
            .sort((a,b)=>(a.v==="field"?a.f:-1)-(b.v==="field"?b.f:-1)); // higher field on top
          if(t===0&&bc){ sl.classList.add("haschord");

let chordRowOn=(localStorage.getItem("hps.chords")||"1")==="1";
function chordPCs(name){
  const m=String(name).match(/^([A-Ga-g])([b♭#♯]?)\s*(maj|min|m)?/);
  if(!m) return null;
  let r=PC[m[1].toUpperCase()];
  if(m[2]==="#"||m[2]==="♯")r++; if(m[2]==="b"||m[2]==="♭")r--;
  r=((r%12)+12)%12;
  const minor=m[3]==="min"||m[3]==="m";
  return [r,(r+(minor?3:4))%12,(r+7)%12];
}
// every tone field on the notated pan whose pitch belongs to the chord — the
// palette is computed from the pan, exactly as SPEC §1 promised
function chordFields(name){
  const pcs=chordPCs(name); if(!pcs) return [];
  const out=[];
  if(pcs.includes(((myPan.ding%12)+12)%12)) out.push(0);
  for(const f of myPan.fields) if(pcs.includes(((f.midi%12)+12)%12)) out.push(f.n);
  return out;   // the student's own fields; highest renders on top
}
const fmtChord=n=>String(n).replace(/♭/g,'<span class="fl">b</span>')
  .replace(/♯/g,'<span class="fl">#</span>');
// The pitch a field produces for the student right now (mode-aware)
function effMidi(f){
  let g=f;
  if(mode==="trans"&&MAP){ g=MAP[f]; if(g===null||g===undefined) return null; }
  return myPan.midiFor(g);
}
// Chords a pan can actually form (all three pitch classes present)
function panTriads(p){
  const pcs=new Set([((p.ding%12)+12)%12,
    ...p.fields.map(f=>((f.midi%12)+12)%12)]);
  const out=[];
  for(const r of pcs){
    for(const [q,third] of [["maj",4],["min",3]]){
      const t=[r,(r+third)%12,(r+7)%12];
      if(t.every(pc=>pcs.has(pc)))
        out.push({name:PCN[r].replace("♯","#")+q,pcs:t,root:r});
    }
  }
  return out;
}
// When a bar carries no written chord, guess it from what sounds — the
// beat-1 stack weighs double. Shown lighter than notated chords.
function inferChord(bar){
  const w=new Map(); let total=0;
  for(const ev of bar){ if(ev.v!=="field") continue;
    const m=effMidi(ev.f); if(m==null) continue;
    const pc=((m%12)+12)%12, wt=ev.t===0?2:1;
    w.set(pc,(w.get(pc)||0)+wt); total+=wt; }
  if(total<2) return null;
  let best=null,bestScore=-1;
  for(const tr of panTriads(myPan)){
    let cov=0,hit=0;
    for(const [pc,wt] of w) if(tr.pcs.includes(pc)){cov+=wt;hit++;}
    const score=cov-(total-cov)*0.6+(w.has(tr.root)?0.3:0);
    if(hit>=2&&cov>=total*0.6&&score>bestScore){bestScore=score;best=tr.name;}
  }
  return best;
}

function baseOf(nm){ const m=String(nm).match(/^(.*?)(\d*)$/); return {base:m[1]||nm,num:m[2]}; }
function arrEntries(){ let pulse=0;
  return piece.arrangement.map((nm,ai)=>{ const m=SM(piece,nm);

/* ---------------- editor ---------------- */
let selHand="alt", lastHand="R", selArt="open";
function snapshot(){ undoStack.push(JSON.stringify(piece)); if(undoStack.length>80) undoStack.shift(); }
function undo(){ if(!undoStack.length){toast("Nothing to undo");return;}
  piece=JSON.parse(undoStack.pop()); refresh(); }
function nextHand(){ if(selHand!=="alt") return selHand;
  lastHand=lastHand==="L"?"R":"L"; return lastHand; }
function slotEvents(loc){ return piece.sections[loc.sec].bars[loc.bar].filter(e=>e.t===loc.t); }
function clearSlot(loc){ const bar=piece.sections[loc.sec].bars[loc.bar];
  for(let i=bar.length-1;i>=0;i--) if(bar[i].t===loc.t) bar.splice(i,1); }
function viewLoc(){
  const m=SM(piece,viewSec), bars=piece.sections[viewSec].bars;
  const bar=Math.floor(cursor/m.bp);
  if(bar>=bars.length) return null;
  return {sec:viewSec,bar,t:cursor%m.bp,pulses:bars.length*m.bp};
}
function place(ev){
  const loc=viewLoc(); if(!loc){toast("No slot here");return;}
  snapshot();
  const bar=piece.sections[loc.sec].bars[loc.bar];
  if(ev.v==="ghost") clearSlot(loc);
  else for(let i=bar.length-1;i>=0;i--) if(bar[i].t===loc.t&&bar[i].v==="ghost") bar.splice(i,1);
  const cnt=slotEvents(loc).length;
  if(cnt>=4){ toast("A slot holds at most 4 symbols"); undoStack.pop(); return; }
  bar.push(Object.assign({},ev,{t:loc.t}));
  cursor=(cursor+1)%loc.pulses;
  refresh();
  if(ctx) fireEvent(Object.assign({},ev),ctx.currentTime+0.01);
}
function placeField(f){ place({v:"field",f,hand:nextHand(),art:selArt==="open"?undefined:selArt}); }
function placePerc(s,g){ place({v:"perc",s,hand:nextHand(),g}); }
function editorKeys(e){
  if(!editing) return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT") return;
  const m=SM(piece,viewSec), bp=m.bp;
  const total=piece.sections[viewSec].bars.length*bp;
  const k=e.key.toLowerCase();
  if((e.metaKey||e.ctrlKey)&&k==="z"){ undo(); e.preventDefault(); return; }
  if(e.metaKey||e.ctrlKey) return;
  if(k>="1"&&k<="9"){ if(+k<=srcPan.fields.length) placeField(+k); e.preventDefault(); }
  else if(k==="0"||k==="d") { placeField(0); e.preventDefault(); }
  else if(k==="m"){ selArt=selArt==="mute"?"open":"mute"; renderEditbar(); }
  else if(k==="o"){ selArt=selArt==="overtone"?"open":"overtone"; renderEditbar(); }
  else if(k==="t"){ placePerc("tak"); e.preventDefault(); }
  else if(k==="k"){ placePerc("tak","K"); e.preventDefault(); }
  else if(k==="s"){ placePerc("slap"); e.preventDefault(); }
  else if(k==="n"){ placePerc("knock"); e.preventDefault(); }
  else if(k==="."||k==="g"){ place({v:"ghost",hand:nextHand()}); e.preventDefault(); }
  else if(k==="h"){ selHand=selHand==="L"?"R":selHand==="R"?"alt":"L"; renderEditbar(); }
  else if(e.key==="ArrowRight"){ cursor=(cursor+1)%total; render(); e.preventDefault(); }
  else if(e.key==="ArrowLeft"){ cursor=(cursor-1+total)%total; render(); e.preventDefault(); }
  else if(e.key==="ArrowDown"){ cursor=(cursor+bp)%total; render(); e.preventDefault(); }
  else if(e.key==="ArrowUp"){ cursor=(cursor-bp+total)%total; render(); e.preventDefault(); }
  else if(e.key==="Backspace"||e.key==="Delete"){ const loc=viewLoc();
    if(loc){ snapshot(); clearSlot(loc); refresh(); } e.preventDefault(); }
}

function dec(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4)s+="=";

function pieceFromText(txt){

  $("playBtn").addEventListener("click",()=>togglePlay());
  $("bpm").addEventListener("change",()=>{ bpm=Math.min(200,Math.max(30,+$("bpm").value||72)); piece.tempo=bpm; });
  $("countBtn").addEventListener("click",()=>{ countIn=!countIn; $("countBtn").classList.toggle("on",countIn); });
  $("halfBtn").addEventListener("click",()=>{ halfSpeed=!halfSpeed; $("halfBtn").classList.toggle("on",halfSpeed); });
  $("chordBtn").classList.toggle("on",chordRowOn);
  $("chordBtn").addEventListener("click",()=>{ chordRowOn=!chordRowOn;
    try{localStorage.setItem("hps.chords",chordRowOn?"1":"0")}catch(e){}
    $("chordBtn").classList.toggle("on",chordRowOn); render(); });
  $("metBtn").classList.toggle("on",metOn);
  $("metBtn").addEventListener("click",()=>{ metOn=!metOn;
    try{localStorage.setItem("hps.met",metOn?"1":"0")}catch(e){}
    $("metBtn").classList.toggle("on",metOn); });
  $("swing").value=swing; $("swingVal").textContent=swing+"%";
  $("swing").addEventListener("input",()=>{ swing=+$("swing").value;
    $("swingVal").textContent=swing+"%";
    try{localStorage.setItem("hps.swing",swing)}catch(e){} });
  $("takBtn").classList.add("hidden");   // tak glyph travels per event (T K pairs in the notation)
  $("title").addEventListener("change",()=>{ piece.title=$("title").value; });
  $("editBtn").addEventListener("click",()=>{
    editing=!editing; $("editBtn").classList.toggle("on",editing);
    $("editbar").classList.toggle("hidden",!editing);
    refresh();
  });
  document.addEventListener("keydown",e=>{
    const typing=["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName);
    if(e.key===" "&&!typing){ e.preventDefault(); togglePlay(); return; }
    if((e.key==="t"||e.key==="T")&&!typing&&!editing&&videoSeen){
      e.preventDefault(); $("tapBtn").click(); return; }
    editorKeys(e);
  });
  $("shareBtn").addEventListener("click",()=>openDlg($("shareDlg")));
  $("shareClose").addEventListener("click",()=>$("shareDlg").close());
  $("cpCode").addEventListener("click",()=>copyText("HPS1:"+enc(piece),"Code copied"));
  $("cpLink").addEventListener("click",()=>{
    const base=location.href.split("#")[0];
    copyText(base+"#p="+enc(piece),"Link copied"); });
  $("dlFile").addEventListener("click",()=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["HPS1:"+enc(piece)+"\n"],{type:"text/plain"}));
    a.download=(piece.title||"piece").replace(/[^\w -]+/g,"")+".hps"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000); });
  $("impFile").addEventListener("click",()=>$("impFileInput").click());
  $("impFileInput").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    f.text().then(txt=>{
      const p=pieceFromText(txt);
      if(!p){ toast("That file could not be read"); return; }
      loadPiece(p); $("shareDlg").close(); toast("Imported: "+(p.title||"Untitled"));
    });
    e.target.value="";
  });
  $("impBtn").addEventListener("click",()=>{
    const p=pieceFromText($("impTxt").value);
    if(!p){ toast("That code could not be read"); return; }
    loadPiece(p); $("shareDlg").close(); toast("Imported: "+(p.title||"Untitled")); });
  $("followBtn").addEventListener("click",()=>{ follow=!follow;
    if(follow){ if(playing) stop(); ensureCtx(); ensureSink(); ctx.resume().catch(()=>{}); preloadBank(); }
    vCursor=null; updateSyncUI();
    toast(follow?"Notation follows the video":"Follow off"); });
  $("folMute").addEventListener("click",()=>{ followMuted=!followMuted;
    $("folMute").textContent="Sound: "+(followMuted?"off":"on");
    $("folMute").classList.toggle("on",!followMuted);
    if(!followMuted){ ensureCtx(); ensureSink(); ctx.resume().catch(()=>{}); preloadBank(); }
    vCursor=null; });
  $("tapBtn").addEventListener("click",()=>{
    if(videoT==null){ toast("No video time yet — is the bridge running?"); return; }
    const bs=barStarts(); if(tapIdx>=bs.length){ toast("All bars tapped"); return; }
    piece.syncMap=piece.syncMap||[];
    piece.syncMap.push({t:+videoT.toFixed(3),p:bs[tapIdx]});
    piece.syncMap.sort((a,b)=>a.t-b.t);
    const tapped=bs[tapIdx]; tapIdx++;
    if(!C) C=compile(piece);
    paintPulse(tapped);            // highlight the tapped bar; the view follows across tables
    updateSyncUI();
  });
  $("tapUndo").addEventListener("click",()=>{
    if(piece.syncMap&&piece.syncMap.length){ piece.syncMap.pop(); tapIdx=Math.max(0,tapIdx-1); }
    updateSyncUI(); });
  $("tapClear").addEventListener("click",()=>{ piece.syncMap=[]; tapIdx=0; updateSyncUI(); });
  $("libBtn").addEventListener("click",()=>{ renderLib(); openDlg($("libDlg")); });
  $("libClose").addEventListener("click",()=>$("libDlg").close());
  $("saveBtn").addEventListener("click",()=>{
    const l=savedPieces(); piece.title=$("title").value;
    const i=l.findIndex(x=>x.id===piece.id&&x.title===piece.title);
    if(i>=0)l[i]=piece; else l.push(JSON.parse(JSON.stringify(piece)));
    setSaved(l); renderLib(); toast("Saved"); });
  $("panNew").addEventListener("click",()=>openDlg($("panDlg")));
  $("npClose").addEventListener("click",()=>$("panDlg").close());
  $("npSave").addEventListener("click",()=>{
    const name=$("npName").value.trim(), ding=$("npDing").value.trim();
    const fields=$("npFields").value.trim().split(/[\s,]+/).filter(Boolean);
    if(!name||midiOf(ding)===null||!fields.length||fields.some(f=>midiOf(f)===null)){
      toast("Check the note names — e.g. C#3 or Bb3"); return; }
    const l=userPans();
    l.push({id:"u-"+Date.now().toString(36),name,ding,fields});
    try{localStorage.setItem("hps.pans",JSON.stringify(l))}catch(e){}
    myPanId=l[l.length-1].id; fillPans(); $("panDlg").close(); refresh(); toast("Pan saved"); });
  // load: hash payload, else the first demo
  let p0=null;
  if(location.hash.startsWith("#p=")) p0=pieceFromText(location.hash.slice(3));
  loadPiece(p0||DEMOS.find(p=>p.id==="composition-2")||DEMOS[0]);
  try{ ensureCtx(); preloadBank(); }catch(e){}   // warm the bank before the first tap
}
boot();
if("serviceWorker" in navigator && /github\.io$/.test(location.hostname))
  navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
