<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawer handle — mockup</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f7f5f0; --card:#fffdfa; --rule:#e4ded2; --rule2:#efeae0;
  --ink:#1c1a17; --ink2:#5b544a; --ink3:#8d857a;
  --dixie:#e59315; --dixie-soft:#fdf3e4; --green:#2f7d5b;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#191714; --card:#232019; --rule:#3a352c; --rule2:#2c2820;
        --ink:#efe9e0; --ink2:#c3bbae; --ink3:#8d857a; --dixie-soft:#3a2e18;}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent}

/* ── the chooser ─────────────────────────────────────────────── */
#pick{padding:10px 12px 4px;flex:none}
#pick h1{font-size:14px;margin:0 0 8px;font-weight:600;color:var(--ink2)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 30%;padding:9px 6px;font-size:13px;font-weight:600;
  border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink2)}
.seg button.on{background:var(--dixie-soft);border-color:var(--dixie);color:var(--ink)}
#note{font-size:12.5px;color:var(--ink3);margin:8px 2px 0;min-height:32px}

/* ── the fake notation, so the handle is judged in place ─────── */
#stage{flex:1;min-height:0;padding:8px 12px;overflow:hidden}
#card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px}
.row{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule2)}
.row:first-child{border-top:none}
.cell{padding:7px 4px;text-align:center;font-size:17px;font-weight:700;border-left:1px solid var(--rule2)}
.cell:first-child{border-left:none}
.cell small{display:block;font-size:11px;color:var(--green);font-weight:700}

/* ── the deck, pinned, exactly as the app pins it ────────────── */
#deck{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--rule);border-radius:16px 16px 0 0;
  padding:0 16px calc(6px + env(safe-area-inset-bottom));z-index:20}
#grip{display:grid;place-items:center;touch-action:none;cursor:grab;
  padding:9px 0 5px;gap:3px}
#grip i{display:block;width:40px;height:4px;border-radius:2px;background:var(--rule);
  transition:width .18s,height .18s,background .18s,transform .18s}
#grip svg{display:block;width:22px;height:11px;color:var(--ink3);
  transition:transform .18s,color .18s,opacity .18s;opacity:0;height:0}
#grip span{font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--ink3);
  text-transform:uppercase;opacity:0;height:0;overflow:hidden;transition:opacity .18s}
#grip.press i{background:var(--ink3)}
#grip.press svg{color:var(--ink2)}
/* variants */
body[data-v="bold"] #grip i{width:56px;height:6px;background:var(--ink3)}
body[data-v="chev"] #grip i{width:0;height:0}
body[data-v="chev"] #grip svg{opacity:1;height:11px}
body[data-v="both"] #grip svg{opacity:1;height:11px}
body[data-v="both"] #grip i{width:48px;height:5px;background:var(--ink3)}
body[data-v="word"] #grip i{width:48px;height:5px;background:var(--ink3)}
body[data-v="word"] #grip span{opacity:1;height:14px}
body.open #grip svg{transform:rotate(180deg)}

#bar{display:flex;align-items:center;gap:10px;padding-bottom:4px}
.pill{padding:8px 12px;border:1px solid var(--rule);border-radius:11px;
  font-size:13px;font-weight:600;color:var(--ink2);background:var(--bg)}
#play{margin-left:auto;width:56px;height:56px;border-radius:50%;background:var(--dixie);
  display:grid;place-items:center;color:#1c1a17;flex:none}
#play svg{width:20px;height:20px}
#panel{height:0;overflow:hidden;transition:height .24s cubic-bezier(.22,.61,.36,1)}
#panel .inner{padding:4px 0 10px;display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid var(--rule2);padding-top:8px;font-size:13.5px;color:var(--ink2)}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:10;opacity:0;
  pointer-events:none;transition:opacity .2s}
body.open #shade{opacity:1;pointer-events:auto}
#peekBtn{margin:6px 2px 0;padding:9px;width:100%;border-radius:10px;
  border:1px dashed var(--dixie);background:none;color:var(--ink2);font-size:13px;font-weight:600}
</style>
</head>
<body data-v="now">

<div id="pick">
  <h1>How obvious is the drawer?</h1>
  <div class="seg">
    <button data-v="now" class="on">1 · Now</button>
    <button data-v="bold">2 · Bolder bar</button>
    <button data-v="chev">3 · Chevron</button>
    <button data-v="both">4 · Both</button>
    <button data-v="word">5 · With a word</button>
  </div>
  <button id="peekBtn">▲ Play the one-time peek</button>
  <div id="note"></div>
</div>

<div id="stage">
  <div id="card">
    <div class="row"><div class="cell"><small>6</small>1</div><div class="cell">3</div><div class="cell"><small>6</small>1</div><div class="cell">3</div></div>
    <div class="row"><div class="cell"><small>6</small>2</div><div class="cell">4</div><div class="cell"><small>8</small>2</div><div class="cell">4</div></div>
    <div class="row"><div class="cell"><small>7</small>3</div><div class="cell">5</div><div class="cell"><small>7</small>3</div><div class="cell">5</div></div>
    <div class="row"><div class="cell"><small>7</small>3</div><div class="cell">5</div><div class="cell"><small>9</small>3</div><div class="cell">5</div></div>
  </div>
</div>

<div id="shade"></div>
<div id="deck">
  <div id="grip" role="button" tabindex="0" aria-expanded="false" aria-label="Settings for what you are doing">
    <svg viewBox="0 0 22 11" fill="none" aria-hidden="true"><path d="M2 9L11 2.5L20 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <i></i>
    <span>More</span>
  </div>
  <div id="panel"><div class="inner">
    <div class="drow"><span>Tempo</span><span>92 BPM</span></div>
    <div class="drow"><span>My pan</span><span>D Kurd 17</span></div>
    <div class="drow"><span>Feel</span><span>Straight</span></div>
    <div class="drow"><span>Hand colours</span><span>On</span></div>
  </div></div>
  <div id="bar">
    <span class="pill">92 BPM</span><span class="pill">Count-in</span><span class="pill">½</span>
    <div id="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.6l13 7.4-13 7.4z"/></svg></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const NOTES={
  now:"What the app has today: a 40×4 bar in the iOS grabber style. Tap or swipe both work already — it just doesn't look like a control.",
  bold:"The same idea, bigger and darker. Cheapest change, no new meaning: the shape still reads as decoration.",
  chev:"A chevron says 'there is more above this'. Most meaning per pixel, and it turns over when the drawer is open.",
  both:"Chevron and bar together — the arrow explains, the bar still says 'draggable'.",
  word:"Unambiguous, but it costs vertical space in the deck, and the drawer means something different in each room."
};
function setV(v){ document.body.dataset.v=v;
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("#note").textContent=NOTES[v]; }
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>setV(b.dataset.v)));
setV("now");

const panel=$("#panel"), grip=$("#grip");
function open(on){
  document.body.classList.toggle("open",on);
  grip.setAttribute("aria-expanded",on?"true":"false");
  panel.style.height=on?(panel.firstElementChild.offsetHeight+"px"):"0px";
}
let sy=0, moved=false;
grip.addEventListener("pointerdown",e=>{ sy=e.clientY; moved=false; grip.classList.add("press");
  try{ grip.setPointerCapture(e.pointerId); }catch(err){} });
grip.addEventListener("pointermove",e=>{ const dy=e.clientY-sy;
  if(!moved&&Math.abs(dy)>6){ moved=true; open(dy<0); } });
const end=()=>{ grip.classList.remove("press"); if(!moved) open(!document.body.classList.contains("open")); };
grip.addEventListener("pointerup",end);
grip.addEventListener("pointercancel",()=>grip.classList.remove("press"));
$("#shade").addEventListener("pointerdown",()=>open(false));

/* the one-time peek: the drawer lifts a little and settles, once */
$("#peekBtn").addEventListener("click",()=>{
  if(document.body.classList.contains("open")) open(false);
  panel.style.transition="height .34s cubic-bezier(.22,.61,.36,1)";
  panel.style.height="14px";
  grip.animate([{transform:"translateY(0)"},{transform:"translateY(-5px)"},{transform:"translateY(0)"}],
               {duration:620,easing:"cubic-bezier(.22,.61,.36,1)"});
  setTimeout(()=>{ panel.style.height="0px";
    setTimeout(()=>{ panel.style.transition="height .24s cubic-bezier(.22,.61,.36,1)"; },360); },520);
});
</script>
</body>
</html>
